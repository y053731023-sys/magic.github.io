<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Watch Peek Pro</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --bg-color: #000; --led-size: 25px; }
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: var(--bg-color); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: transparent; }
        #led { position: relative; width: var(--led-size); height: var(--led-size); border-radius: 50%; opacity: 0; z-index: 10; transform: scale(0.5); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #led.active { opacity: 1; transform: scale(1); }
        #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 3px; height: 3px; background-color: #1a1a1a; z-index: 2; border-radius: 50%; }
        #debug { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: #0f0; font-size: 10px; font-family: monospace; padding: 10px; display: none; z-index: 100; pointer-events: none; word-break: break-all; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <div class="overlay" onclick="handleInteraction()"></div>
    <div id="status"></div>
    <div id="led"></div>

    <script>
        const debugDiv = document.getElementById('debug');
        const led = document.getElementById('led');
        const statusDot = document.getElementById('status');
        
        function log(msg) {
            console.log(msg);
            debugDiv.innerText += msg + "\n";
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        let tapCount = 0;
        let tapTimer;
        function handleInteraction() {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 3) {
                debugDiv.style.display = debugDiv.style.display === 'none' ? 'block' : 'none';
                tapCount = 0;
            }
            tapTimer = setTimeout(() => { tapCount = 0; }, 500);
            startWakeLock();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || '211082';
        const topic = `magic/painting/${roomId}`;
        log(`Room: ${roomId}`);

        const brokers = [
            'wss://broker.hivemq.com:8884/mqtt',
            'wss://broker.emqx.io:8084/mqtt'
        ];
        let currentBrokerIdx = 0;

        function connect() {
            if (window.mqttClient) {
                try { window.mqttClient.end(); } catch(e) {}
            }
            const broker = brokers[currentBrokerIdx];
            log(`Connecting to ${broker}...`);
            
            try {
                const client = mqtt.connect(broker, {
                    clientId: 'watch_' + Math.random().toString(16).slice(2, 10),
                    reconnectPeriod: 5000,
                    connectTimeout: 10000
                });

                client.on('connect', () => {
                    log("✅ Connected!");
                    statusDot.style.backgroundColor = '#003300';
                    client.subscribe(topic);
                });

                client.on('message', (t, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        if (data.type === 'pick') {
                            log(`📩 Picked: ${data.hex}`);
                            showLed(data.hex);
                        }
                    } catch(e) { log("Error parsing data"); }
                });

                client.on('error', (err) => {
                    log(`❌ Error: ${err.message}`);
                    client.end();
                    switchToNextBroker();
                });

                client.on('close', () => {
                    statusDot.style.backgroundColor = '#220000';
                });

                window.mqttClient = client;
            } catch (e) {
                log(`Init error: ${e.message}`);
                switchToNextBroker();
            }
        }

        function switchToNextBroker() {
            currentBrokerIdx = (currentBrokerIdx + 1) % brokers.length;
            setTimeout(connect, 3000);
        }

        let lastMessageTime = Date.now();
        async function startPollingFallback() {
            log("📡 Polling Mode Active...");
            statusDot.style.backgroundColor = '#000033'; 
            const dweetTopic = `magic-painting-${roomId}`;
            
            setInterval(async () => {
                try {
                    const response = await fetch(`https://dweet.cc/get/latest/dweet/for/${dweetTopic}`);
                    const json = await response.json();
                    if (json.this === 'succeeded' && json.with && json.with.length > 0) {
                        const dweet = json.with[0];
                        const timestamp = new Date(dweet.created).getTime();
                        
                        if (timestamp > lastMessageTime) {
                            lastMessageTime = timestamp;
                            const data = dweet.content;
                            if (data.type === 'pick' && data.hex) {
                                log(`📩 Poll: ${data.hex}`);
                                showLed(data.hex);
                            }
                        }
                    }
                } catch (e) {}
            }, 1500);
        }

        let fadeTimer;
        function showLed(hex) {
            clearTimeout(fadeTimer);
            led.style.backgroundColor = hex;
            led.style.boxShadow = `0 0 20px ${hex}, 0 0 40px ${hex}`;
            led.classList.add('active');
            if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
            fadeTimer = setTimeout(() => led.classList.remove('active'), 4000);
        }

        async function startWakeLock() {
            if ('wakeLock' in navigator) {
                try { 
                    await navigator.wakeLock.request('screen'); 
                    statusDot.style.boxShadow = '0 0 4px #0f0'; 
                } catch (e) {}
            }
        }

        if (!window.WebSocket) {
            log("⚠️ No WebSocket support!");
            startPollingFallback();
        } else if (typeof mqtt === 'undefined') {
            log("❌ MQTT not loaded!");
        } else {
            connect();
        }
    </script>
</body>
</html>
