<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Watch Peek Hybrid</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --bg-color: #000; --led-size: 30px; }
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: var(--bg-color); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: transparent; }
        #led { position: relative; width: var(--led-size); height: var(--led-size); border-radius: 50%; opacity: 0; z-index: 10; transform: scale(0.5); transition: all 0.3s ease-out; }
        #led.active { opacity: 1; transform: scale(1); }
        #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 3px; height: 3px; background-color: #1a1a1a; z-index: 2; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="overlay" onclick="startWakeLock()"></div>
    <div id="status"></div>
    <div id="led"></div>

    <script>
        const led = document.getElementById('led');
        const statusDot = document.getElementById('status');
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || '211082';
        const dweetTopic = `magic-painting-${roomId}`;
        
        let lastMessageTime = Date.now() - 10000;
        let fadeTimer;

        function showLed(hex) {
            clearTimeout(fadeTimer);
            led.style.backgroundColor = hex;
            led.style.boxShadow = `0 0 20px ${hex}, 0 0 40px ${hex}`;
            led.classList.add('active');
            
            if (navigator.vibrate) {
                try { navigator.vibrate([40, 60, 40]); } catch(e) {}
            }
            
            fadeTimer = setTimeout(() => {
                led.classList.remove('active');
            }, 3000);
        }

        // --- 引擎 1：HTTP 輪詢保底機制 (對抗手錶休眠斷線) ---
        async function poll() {
            try {
                const url = `https://dweet.io/get/latest/dweet/for/${dweetTopic}?t=${Date.now()}`;
                const res = await fetch(url, { cache: 'no-store' });
                const json = await res.json();
                
                if (json.this === 'succeeded' && json.with && json.with.length > 0) {
                    const dweet = json.with[0];
                    const timestamp = new Date(dweet.created).getTime();
                    
                    if (timestamp > lastMessageTime) {
                        lastMessageTime = timestamp;
                        const data = dweet.content;
                        if (data && data.hex) {
                            showLed(data.hex);
                        }
                    }
                    statusDot.style.backgroundColor = '#003300';
                }
            } catch (e) {
                statusDot.style.backgroundColor = '#330000';
            }
        }
        setInterval(poll, 1500);

        // --- 引擎 2：MQTT 即時連線 (追求極致無延遲) ---
        function initMQTT() {
            if (typeof mqtt === 'undefined') return;
            const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                clientId: 'watch_' + Math.random().toString(16).slice(2, 10),
                reconnectPeriod: 3000,
                connectTimeout: 5000
            });
            client.on('connect', () => {
                client.subscribe(`magic/painting/${roomId}`);
                statusDot.style.boxShadow = '0 0 6px #0f0'; // 綠色光暈代表 MQTT 連接成功
            });
            client.on('message', (t, msg) => {
                try {
                    const data = JSON.parse(msg.toString());
                    const ts = data.timestamp || Date.now();
                    if (ts > lastMessageTime && data.type === 'pick') {
                        lastMessageTime = ts;
                        showLed(data.hex);
                    }
                } catch(e) {}
            });
        }
        initMQTT();

        // --- 點擊螢幕喚醒與重整 ---
        async function startWakeLock() {
            if ('wakeLock' in navigator) {
                try { 
                    await navigator.wakeLock.request('screen'); 
                } catch (e) {}
            }
            poll(); // 點擊時強制更新一次
        }
    </script>
</body>
</html>
