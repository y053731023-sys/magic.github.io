<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數字著色版</title>
    <!-- 引入 MQTT.js 用於即時通訊 -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            min-height: 100vh;
        }

        @media (max-width: 800px) {
            body {
                flex-direction: column;
                align-items: center;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 140px;
            overflow: visible;
        }

        .sidebar.collapsed {
            width: 60px;
        }

        .sidebar.collapsed .palette {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
            padding: 0;
            height: 0;
            margin: 0;
            overflow: hidden;
        }

        .sidebar.collapsed h1 {
            opacity: 0;
            pointer-events: none;
            height: 0;
            margin: 0;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 1000px;
            transition: margin-left 0.3s;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .palette {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 800px) {
            .sidebar {
                position: fixed;
                bottom: 20px;
                left: 20px;
                top: auto;
                width: auto !important;
                height: auto;
                z-index: 100;
                align-items: flex-start;
            }

            .sidebar.collapsed {
                width: 50px !important;
                height: 50px;
            }

            .sidebar:not(.collapsed) .palette {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow-x: auto;
                width: 90vw;
                padding: 12px;
                gap: 10px;
                height: auto;
                opacity: 1;
                transform: translateY(0);
            }

            .sidebar.collapsed .palette {
                transform: translateY(20px);
            }

            .main-content {
                width: 100%;
                padding-bottom: 80px;
            }
        }

        .color-btn {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border: none;
            background: none;
            padding: 6px;
            border-radius: 12px;
            transition: all 0.2s;
            width: 100%;
            flex-shrink: 0;
        }

        @media (max-width: 800px) {
            .color-btn {
                width: 50px;
                height: 50px;
            }
        }

        .color-btn:hover {
            background-color: #f8f9fa;
            transform: scale(1.1);
        }

        .color-btn.active {
            background-color: #e3f2fd;
            box-shadow: inset 0 0 0 2px #1E88E5;
        }

        .color-btn.active .swatch {
            box-shadow: 0 4px 10px rgba(30, 136, 229, 0.3);
        }

        .swatch {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .color-label {
            display: none;
        }

        .toggle-btn {
            width: 50px;
            height: 50px;
            background: #333;
            color: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 110;
        }

        .toggle-btn:hover {
            transform: scale(1.1) rotate(15deg);
            background: #000;
        }

        .sidebar:not(.collapsed) .toggle-btn {
            background: #1E88E5;
            margin-bottom: 5px;
        }

        @media (max-width: 800px) {
            .toggle-btn {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            }
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        canvas {
            display: block;
            cursor: crosshair;
            max-width: 100vw;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn {
            background-color: #f5f5f5;
            color: #666;
        }

        .reset-btn:hover {
            background-color: #eeeeee;
            color: #333;
        }

        .finish-btn {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .finish-btn:hover {
            background-color: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
        }

        .finish-btn:active {
            transform: translateY(0);
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        canvas {
            display: block;
            cursor: crosshair;
            max-width: 100vw;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn {
            background-color: #f5f5f5;
            color: #666;
        }

        .reset-btn:hover {
            background-color: #eeeeee;
            color: #333;
        }

        .finish-btn {
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .finish-btn:hover {
            background-color: #43a047;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
        }

        .finish-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="sidebar collapsed" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()" title="開啟/關閉調色盤">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <path
                    d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.5 2-1.2l.6-1c.4-.7 1.1-1.2 2.1-1.2H19c1.7 0 3-1.3 3-3 0-6.1-4.5-10.6-10-10.6Z" />
            </svg>
        </button>
        <div class="palette" id="palette"></div>
    </div>

    <!-- 完全隱藏 Room ID，只有在需要時透過長按標題顯示 -->
    <div id="room-info"
        style="display: none; position: fixed; top: 10px; right: 10px; font-size: 10px; color: rgba(0,0,0,0.2); z-index: 1000; text-align: right;">
        <div onclick="copyRoomUrl()" style="cursor:pointer; margin-bottom: 5px;">ROOM (Phone): ---</div>
        <div onclick="copyWatchUrl()" style="cursor:pointer;">ROOM (Watch): ---</div>
    </div>


    <div class="main-content">
        <div class="button-group">
            <button class="btn reset-btn" onclick="resetCanvas()">重新上色</button>
            <button class="btn finish-btn" onclick="finishColoring()">完成上色</button>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="numberLayer"
                style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
        </div>
    </div>

        const startPress = () => {
            pressTimer = setTimeout(() => {
                roomInfo.style.display = roomInfo.style.display === 'block' ? 'none' : 'block';
            }, 2000);
        };
        const endPress = () => clearTimeout(pressTimer);

        triggerElement?.addEventListener('mousedown', startPress);
        triggerElement?.addEventListener('mouseup', endPress);
        triggerElement?.addEventListener('touchstart', startPress);
        triggerElement?.addEventListener('touchend', endPress);

        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
            clientId: 'sender_' + Math.random().toString(16).slice(2, 10),
            reconnectPeriod: 2000
        });

        const topic = `magic/painting/${roomId}`;

        mqttClient.on('connect', () => {
            console.log('Main App Connected:', topic);
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT Error:', err);
        });

        function broadcastColor(colorIdx) {
            const data = {
                type: 'pick',
                colorId: colors[colorIdx].id,
                hex: colors[colorIdx].hex,
                name: colors[colorIdx].name,
                timestamp: Date.now()
            };

            // 1. MQTT (Original)
            if (mqttClient.connected) {
                mqttClient.publish(topic, JSON.stringify(data));
            }

            // 2. HTTP Fallback (for environments without WebSockets like Apple Watch)
            const dweetTopic = `magic-painting-${roomId}`;
            fetch(`https://dweet.io/dweet/for/${dweetTopic}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(() => {}); 
        }

        function copyRoomUrl() {
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            const peekUrl = url.origin + url.pathname.replace('index.html', '') + 'peek.html?room=' + roomId;
            navigator.clipboard.writeText(peekUrl).then(() => alert('手機版 Peek 連結已複製'));
        }

        function copyWatchUrl() {
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            const watchUrl = url.origin + url.pathname.replace('index.html', '') + 'peek-watch.html?room=' + roomId;
            navigator.clipboard.writeText(watchUrl).then(() => alert('手錶版 Peek 連結已複製'));
        }
        // -----------------------


        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const numberLayer = document.getElementById('numberLayer');

        const img = document.getElementById('sourceImg');
        let canvasWidth, canvasHeight;
        let colorablePixels;

        const clothesParts = [
            { name: '衣服', group: [7, 8, 9, 10, 13, 14], colorId: null },
            { name: '領帶', group: [11, 12], colorId: null },
            { name: '褲子', group: [17, 18, 19, 20, 21, 22, 23], colorId: null },
            { name: '襪子', group: [24, 25], colorId: null },
            { name: '鞋子', group: [26, 27, 28, 29, 30, 31], colorId: null }
        ];

        const groupDefs = clothesParts.map(p => p.group);


        img.onload = () => {
            initCanvas();
        };

        // In case the image is already loaded from base64 when the script runs
        if (img.complete) {
            initCanvas();
        }

        function initCanvas() {
            if (canvasWidth) return; // already initialized

            const maxW = window.innerWidth * 0.9;
            const maxH = window.innerHeight * 0.7;

            let scale = 1;
            if (img.width > maxW || img.height > maxH) {
                scale = Math.min(maxW / img.width, maxH / img.height);
            }

            canvasWidth = img.width;
            canvasHeight = img.height;
            colorablePixels = new Uint16Array(canvasWidth * canvasHeight);

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            canvas.style.width = (canvasWidth * scale) + 'px';
            canvas.style.height = (canvasHeight * scale) + 'px';

            ctx.drawImage(img, 0, 0);
            analyzeRegions();
            autoFillDefaults();
        }

        function analyzeRegions() {
            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;
            const visited = new Uint8Array(canvasWidth * canvasHeight);
            let regionCounter = 1;

            for (let y = 0; y < canvasHeight; y++) {
                for (let x = 0; x < canvasWidth; x++) {
                    const idx = y * canvasWidth + x;
                    if (visited[idx]) continue;

                    const pIdx = idx * 4;
                    const isWhite = data[pIdx] > 180 && data[pIdx + 1] > 180 && data[pIdx + 2] > 180;

                    if (isWhite) {
                        const q = [idx];
                        visited[idx] = 1;
                        let sumX = 0, sumY = 0;
                        let count = 0;

                        let head = 0;
                        while (head < q.length) {
                            const curr = q[head++];
                            const cx = curr % canvasWidth;
                            const cy = Math.floor(curr / canvasWidth);

                            sumX += cx;
                            sumY += cy;
                            count++;

                            if (cx > 0) check(curr - 1);
                            if (cx < canvasWidth - 1) check(curr + 1);
                            if (cy > 0) check(curr - canvasWidth);
                            if (cy < canvasHeight - 1) check(curr + canvasWidth);

                            function check(n) {
                                if (!visited[n]) {
                                    visited[n] = 1;
                                    if (data[n * 4] > 180 && data[n * 4 + 1] > 180 && data[n * 4 + 2] > 180) {
                                        q.push(n);
                                    }
                                }
                            }
                        }

                        if (count > 100) {
                            const num = regionCounter++;
                            for (let i = 0; i < count; i++) {
                                colorablePixels[q[i]] = num;
                            }

                            let cX = Math.floor(sumX / count);
                            let cY = Math.floor(sumY / count);

                            // 若平均中心點落到了區塊外（例如 U 型褲管中間的黑線或空隙），則強制從該區塊內取一點
                            if (colorablePixels[cY * canvasWidth + cX] !== num) {
                                const fallbackIdx = q[Math.floor(count / 2)];
                                cX = fallbackIdx % canvasWidth;
                                cY = Math.floor(fallbackIdx / canvasWidth);
                            }

                            const span = document.createElement('span');
                            span.textContent = num;
                            span.style.position = 'absolute';
                            span.style.left = ((cX / canvasWidth) * 100) + '%';
                            span.style.top = ((cY / canvasHeight) * 100) + '%';
                            span.style.transform = 'translate(-50%, -50%)';
                            span.style.fontWeight = 'normal';
                            span.style.fontSize = 'clamp(8px, 1.5vw, 12px)';
                            span.style.textShadow = '0px 0px 2px rgba(255,255,255,0.9)';
                            span.dataset.regionId = num;
                            span.style.display = 'none'; // 隱藏區塊編號
                            numberLayer.appendChild(span);
                        }
                    } else {
                        visited[idx] = 1;
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', function (e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            fillRegionsAt(x, y, colors[currentColorIndex].rgb);
        });

        canvas.addEventListener('touchstart', function (e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = Math.floor((touch.clientX - rect.left) * scaleX);
            const y = Math.floor((touch.clientY - rect.top) * scaleY);

            fillRegionsAt(x, y, colors[currentColorIndex].rgb);
        });

        function fillRegionsAt(x, y, fillColorRGB) {
            if (isFinished) return; // 已完成，禁止上色
            if (x < 0 || y < 0 || x >= canvasWidth || y >= canvasHeight) return;

            const startIdx1D = Math.floor(y) * canvasWidth + Math.floor(x);
            const clickedRegion = colorablePixels[startIdx1D];
            if (!clickedRegion) return; // 0 means uncolorable

            broadcastColor(currentColorIndex); // 點擊畫布也觸發同步


            let regionsToFill = [clickedRegion];
            for (const group of groupDefs) {
                if (group.includes(clickedRegion)) {
                    regionsToFill = group;
                    break;
                }
            }

            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;

            // 一次性將群組內所有標記好的區塊進行填色，速度極快且邊界平滑
            for (let i = 0; i < colorablePixels.length; i++) {
                if (regionsToFill.includes(colorablePixels[i])) {
                    data[i * 4] = fillColorRGB.r;
                    data[i * 4 + 1] = fillColorRGB.g;
                    data[i * 4 + 2] = fillColorRGB.b;
                    data[i * 4 + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // 記錄該群組對應的顏色數字
            const partIdx = clothesParts.findIndex(p => p.group.includes(clickedRegion));
            if (partIdx !== -1) {
                clothesParts[partIdx].colorId = colors[currentColorIndex].id;
                console.log(`已設定 ${clothesParts[partIdx].name} 為顏色 ${colors[currentColorIndex].id}`);
            }

            // 隱藏已經上色群組內所有的對應數字
            Array.from(numberLayer.children).forEach(span => {
                let id = parseInt(span.dataset.regionId);
                if (regionsToFill.includes(id)) {
                    span.style.display = 'none';
                }
            });
        }

        function finishColoring() {
            // 檢查是否所有部位都已上色
            const incomplete = clothesParts.filter(p => !p.colorId);
            if (incomplete.length > 0) return;

            // 串接成 5 位數字字串
            const result = clothesParts.map(p => p.colorId).join('');

            // 複製到剪貼簿
            navigator.clipboard.writeText(result).then(() => {
                console.log(`代碼已複製：${result}`);
                isFinished = true;
                canvas.style.cursor = 'default';
            }).catch(err => {
                console.error('無法複製代碼: ', err);
                const tempInput = document.createElement('input');
                tempInput.value = result;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                isFinished = true;
                canvas.style.cursor = 'default';
            });
        }


        function autoFillDefaults() {
            const skinRegions = [3, 4, 5, 6, 15, 16];
            const hairRegions = [2];
            const eyebrowRegions = []; // TODO: 告訴我眉毛的區塊編號，填入這裡
            const lockedRegions = [1, ...skinRegions, ...hairRegions, ...eyebrowRegions]; // 1=背景，不可上色
            const skinColor = { r: 255, g: 200, b: 160 };
            const hairColor = { r: 101, g: 55, b: 0 };
            const eyebrowColor = { r: 30, g: 20, b: 10 }; // 近黑色

            const imgData = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
            const data = imgData.data;

            for (let i = 0; i < colorablePixels.length; i++) {
                const id = colorablePixels[i];
                if (skinRegions.includes(id)) {
                    data[i * 4] = skinColor.r;
                    data[i * 4 + 1] = skinColor.g;
                    data[i * 4 + 2] = skinColor.b;
                    data[i * 4 + 3] = 255;
                } else if (hairRegions.includes(id)) {
                    data[i * 4] = hairColor.r;
                    data[i * 4 + 1] = hairColor.g;
                    data[i * 4 + 2] = hairColor.b;
                    data[i * 4 + 3] = 255;
                } else if (eyebrowRegions.includes(id)) {
                    data[i * 4] = eyebrowColor.r;
                    data[i * 4 + 1] = eyebrowColor.g;
                    data[i * 4 + 2] = eyebrowColor.b;
                    data[i * 4 + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);

            // 鎖定背景、皮膚、頭髮、眉毛 → 設為 0 使其無法被點擊上色
            for (let i = 0; i < colorablePixels.length; i++) {
                if (lockedRegions.includes(colorablePixels[i])) {
                    colorablePixels[i] = 0;
                }
            }
        }

        function resetCanvas() {
            ctx.drawImage(img, 0, 0);
            numberLayer.innerHTML = '';
            colorablePixels = new Uint16Array(canvasWidth * canvasHeight);
            analyzeRegions();
            autoFillDefaults();
            // 重設紀錄
            clothesParts.forEach(p => p.colorId = null);
            isFinished = false;
            canvas.style.cursor = 'crosshair';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
    </script>
</body>
