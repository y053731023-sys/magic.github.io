<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peek</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 30px;
        }

        /* LED 指示燈 */
        #led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: transparent;
            transition: all 0.3s ease;
            opacity: 0;
        }

        /* 發光效果 */
        #led.active {
            opacity: 1;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 4px;
            height: 4px;
            background-color: #111;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <div id="led"></div>

    <script>
        const led = document.getElementById('led');
        const statusDot = document.getElementById('status');
        
        // 解析房間 ID
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || '211082';

        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const topic = `magic/painting/${roomId}`;

        mqttClient.on('connect', () => {
            console.log('Peek connected to room:', roomId);
            statusDot.style.backgroundColor = '#002200'; // 極微弱綠光表示連線
        });

        mqttClient.on('message', (t, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.type === 'pick') {
                    updateLed(data.hex);
                    triggerVibration();
                }
            } catch (e) {
                console.error('Data error:', e);
            }
        });

        mqttClient.subscribe(topic);

        let fadeTimer;
        function updateLed(hex) {
            clearTimeout(fadeTimer);
            
            led.style.backgroundColor = hex;
            led.style.boxShadow = `0 0 8px ${hex}, 0 0 15px ${hex}`;
            led.classList.add('active');

            // 5 秒後自動淡出，保持隱蔽
            fadeTimer = setTimeout(() => {
                led.classList.remove('active');
            }, 5000);
        }

        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([30, 50, 30]); // 極短的三震動
            }
        }

        // 防止手機休眠 (若支援)
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            const requestWakeLock = async () => {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            };
            document.addEventListener('click', requestWakeLock);
        }
    </script>
</body>
</html>
