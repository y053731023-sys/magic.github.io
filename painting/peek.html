<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Peek</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 30px;
        }

        /* LED 指示燈 */
        #led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: transparent;
            transition: all 0.3s ease;
            opacity: 0;
        }

        /* 發光效果 */
        #led.active {
            opacity: 1;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 4px;
            height: 4px;
            background-color: #111;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <div id="led"></div>

    <script>
        const led = document.getElementById('led');
        const statusDot = document.getElementById('status');
        
        // 解析房間 ID
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || '211082';

        const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const topic = `magic/painting/${roomId}`;

        mqttClient.on('connect', () => {
            console.log('Peek connected to room:', roomId);
            statusDot.style.backgroundColor = '#002200'; // 極微弱綠光表示連線
        });

        mqttClient.on('message', (t, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.type === 'pick') {
                    updateLed(data.hex);
                    triggerVibration();
                }
            } catch (e) {
                console.error('Data error:', e);
            }
        });

        mqttClient.subscribe(topic);

        let fadeTimer;
        function updateLed(hex) {
            clearTimeout(fadeTimer);
            
            led.style.backgroundColor = hex;
            led.style.boxShadow = `0 0 8px ${hex}, 0 0 15px ${hex}`;
            led.classList.add('active');

            // 5 秒後自動淡出，保持隱蔽
            fadeTimer = setTimeout(() => {
                led.classList.remove('active');
            }, 5000);
        }

        function triggerVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([30, 50, 30]); // 極短的三震動
            }
        }

        // 進入全螢幕模式
        const requestFullScreen = async () => {
            try {
                const doc = document.documentElement;
                if (doc.requestFullscreen) {
                    await doc.requestFullscreen();
                } else if (doc.webkitRequestFullscreen) {
                    await doc.webkitRequestFullscreen();
                }
            } catch (err) {
                console.log('Fullscreen failed:', err);
            }
        };

        // 螢幕常亮 (Wake Lock)
        let wakeLock = null;
        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active');
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        };

        // 按下螢幕任何地方觸發「全螢幕」與「常亮」
        document.addEventListener('click', async () => {
            await requestFullScreen();
            await requestWakeLock();
        });

        // 重新獲得焦點時自動重新請求 Wake Lock
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
