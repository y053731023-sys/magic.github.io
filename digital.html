<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>相機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        ::-webkit-scrollbar { display: none; }
        
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 滿版相機畫面 */
        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 疊加的 AR 畫布 */
        #ar-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* UI 覆蓋層 */
        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .top-bar {
            top: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            height: 100px;
        }

        .bottom-bar {
            bottom: 0;
            height: 160px;
            background: rgba(0, 0, 0, 0.7);
            flex-direction: row;
            padding-bottom: 40px;
        }

        /* 仿 iOS 快門鍵 */
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: white;
            border: 4px solid #000;
            box-shadow: 0 0 0 3px white;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shutter-btn:active { transform: scale(0.95); }

        /* 隱形控制台 */
        #secret-menu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #444;
            border-radius: 16px;
            padding: 24px;
            z-index: 100;
            width: 80%;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }

        /* 對焦框動畫 */
        .focus-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #fbbf24;
            border-radius: 4px;
            transform: translate(-50%, -50%) scale(1.2);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease-out;
        }
        .focus-ring.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<div id="camera-container">
    <video id="video-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>
    <div id="focus-ring" class="focus-ring"></div>

    <div class="ui-layer top-bar text-white">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        <div id="trigger-reveal-btn" class="p-2 cursor-pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </div>
    </div>

    <div id="touch-area" class="absolute top-[100px] bottom-[160px] left-0 right-0 z-[5]"></div>

    <div class="ui-layer bottom-bar">
        <div id="secret-trigger-btn" class="w-12 h-12 bg-gray-800 rounded-md border border-gray-600 overflow-hidden cursor-pointer"></div>
        <div class="shutter-btn" id="fake-shutter"></div>
        <div class="w-12 h-12 flex items-center justify-center text-white cursor-pointer" id="flip-camera">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
        </div>
    </div>
</div>

<div id="secret-menu" class="text-white">
    <h3 class="text-lg font-bold mb-4 text-center border-b border-gray-600 pb-2">魔術設定 (Force)</h3>
    <div class="mb-4">
        <label class="block text-sm mb-1 text-gray-300">花色</label>
        <div class="flex justify-between gap-2">
            <button class="suit-btn flex-1 bg-gray-700 py-2 rounded text-xl" data-suit="♠">♠</button>
            <button class="suit-btn flex-1 bg-gray-700 py-2 rounded text-xl text-red-500" data-suit="♥">♥</button>
            <button class="suit-btn flex-1 bg-gray-700 py-2 rounded text-xl text-red-500" data-suit="♦">♦</button>
            <button class="suit-btn flex-1 bg-gray-700 py-2 rounded text-xl" data-suit="♣">♣</button>
        </div>
    </div>
    <div class="mb-6">
        <label class="block text-sm mb-1 text-gray-300">點數</label>
        <select id="card-value" class="w-full bg-gray-700 text-white p-2 rounded outline-none">
            <option value="A">A</option>
            <option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="7" selected>7</option>
            <option value="8">8</option><option value="9">9</option><option value="10">10</option>
            <option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
        </select>
    </div>
    <button id="close-menu-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        設定完成並隱藏
    </button>
</div>

<script>
    let hasUserTapped = false;

    let magicState = {
        suit: '♥', value: '7',
        targetX: window.innerWidth / 2 || 150, 
        targetY: window.innerHeight / 2 || 300,
        isRevealing: false, revealProgress: 0,
        isFrozen: false, scale: 1, rotation: 0
    };

    const video = document.getElementById('video-feed');
    const canvas = document.getElementById('ar-canvas');
    const ctx = canvas.getContext('2d');
    const touchArea = document.getElementById('touch-area');
    const focusRing = document.getElementById('focus-ring');
    const triggerBtn = document.getElementById('trigger-reveal-btn');
    const secretTriggerBtn = document.getElementById('secret-trigger-btn');
    const secretMenu = document.getElementById('secret-menu');
    const closeMenuBtn = document.getElementById('close-menu-btn');
    const suitBtns = document.querySelectorAll('.suit-btn');
    const valueSelect = document.getElementById('card-value');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (!hasUserTapped) {
            magicState.targetX = canvas.width / 2;
            magicState.targetY = canvas.height / 2;
        }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    async function startCamera(facingMode = 'environment') {
        if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            } catch (fallbackErr) { console.error("相機存取失敗", fallbackErr); }
        }
    }
    startCamera();

    // 魔術師設定介面
    let pressTimer;
    const showMenu = () => { pressTimer = setTimeout(() => secretMenu.style.display = 'block', 1500); };
    const clearTimer = () => clearTimeout(pressTimer);
    secretTriggerBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showMenu(); });
    secretTriggerBtn.addEventListener('touchend', clearTimer);
    secretTriggerBtn.addEventListener('mousedown', showMenu);
    secretTriggerBtn.addEventListener('mouseup', clearTimer);
    secretTriggerBtn.addEventListener('mouseleave', clearTimer);

    suitBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            suitBtns.forEach(b => b.classList.remove('bg-gray-500'));
            btn.classList.add('bg-gray-500');
            magicState.suit = btn.getAttribute('data-suit');
        });
    });
    document.querySelector('[data-suit="♥"]').classList.add('bg-gray-500');
    valueSelect.addEventListener('change', (e) => magicState.value = e.target.value);

    closeMenuBtn.addEventListener('click', () => {
        secretMenu.style.display = 'none';
        magicState.isRevealing = false;
        magicState.revealProgress = 0;
        magicState.scale = 1; magicState.rotation = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // 觸控與手勢微調
    let initialTouchDist = 0, initialScale = 1, initialTouchAngle = 0, initialRotation = 0;

    touchArea.addEventListener('touchstart', (e) => {
        hasUserTapped = true; 
        if (e.touches.length === 1) {
            magicState.targetX = e.touches[0].clientX;
            magicState.targetY = e.touches[0].clientY;
            focusRing.style.left = `${magicState.targetX}px`;
            focusRing.style.top = `${magicState.targetY}px`;
            focusRing.classList.remove('active');
            void focusRing.offsetWidth; 
            focusRing.classList.add('active');
            setTimeout(() => focusRing.classList.remove('active'), 800);
        } else if (e.touches.length === 2) {
            initialTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            initialScale = magicState.scale;
            initialTouchAngle = Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);
            initialRotation = magicState.rotation;
        }
    });

    touchArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            magicState.targetX = e.touches[0].clientX;
            magicState.targetY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            magicState.scale = initialScale * (currentDist / initialTouchDist);
            const currentAngle = Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);
            magicState.rotation = initialRotation + (currentAngle - initialTouchAngle);
        }
    }, { passive: false });

    // ==========================================
    // 🚀 核心黑科技：360度邊界掃描 + PCA 主成分分析
    // ==========================================
    function autoDetectCardBounds(videoElement, tapX, tapY, canvasW, canvasH) {
        if (videoElement.videoWidth === 0) return null;

        const processScale = 0.5; // 縮小一半處理，提升運算效能
        const tempCanvas = document.createElement('canvas');
        const w = Math.floor(canvasW * processScale);
        const h = Math.floor(canvasH * processScale);
        tempCanvas.width = w; tempCanvas.height = h;
        const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
        
        const videoRatio = videoElement.videoWidth / videoElement.videoHeight;
        const canvasRatio = w / h;
        let drawW, drawH, startX, startY;
        if (videoRatio > canvasRatio) {
            drawH = h; drawW = videoElement.videoWidth * (h / videoElement.videoHeight);
            startX = (w - drawW) / 2; startY = 0;
        } else {
            drawW = w; drawH = videoElement.videoHeight * (w / videoElement.videoWidth);
            startX = 0; startY = (h - drawH) / 2;
        }
        tCtx.drawImage(videoElement, startX, startY, drawW, drawH);

        const imgData = tCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        
        const getLuma = (x, y) => {
            x = Math.floor(x); y = Math.floor(y);
            if (x < 0 || x >= w || y < 0 || y >= h) return -1;
            const i = (y * w + x) * 4;
            return data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
        };

        const edgeThreshold = 18; 
        const tX = tapX * processScale;
        const tY = tapY * processScale;
        const boundaryPoints = [];
        
        // 1. 360 度發射 72 條射線，尋找卡片邊緣
        for (let angleDeg = 0; angleDeg < 360; angleDeg += 5) {
            const rad = angleDeg * Math.PI / 180;
            const dx = Math.cos(rad);
            const dy = Math.sin(rad);
            
            // 跳過起始點周圍 (避免誤判手指陰影)
            let x = tX + dx * 15;
            let y = tY + dy * 15;
            let baseLuma = getLuma(x, y);
            if (baseLuma === -1) continue;
            
            let steps = 15;
            let maxSteps = Math.min(w, h);
            
            while (steps < maxSteps) {
                x += dx; y += dy; steps++;
                let currentLuma = getLuma(x, y);
                if (currentLuma === -1) break;
                
                // 偵測到明顯的光影突變 (邊界)
                if (Math.abs(currentLuma - baseLuma) > edgeThreshold) {
                    boundaryPoints.push({x, y, dist: steps});
                    break;
                }
                // 動態適應漸層光影
                baseLuma = baseLuma * 0.8 + currentLuma * 0.2; 
            }
        }

        if (boundaryPoints.length < 15) return null;

        // 2. 濾除離群值 (剔除射太遠的雜訊)
        boundaryPoints.sort((a, b) => a.dist - b.dist);
        const medianDist = boundaryPoints[Math.floor(boundaryPoints.length / 2)].dist;
        const validPoints = boundaryPoints.filter(p => p.dist < medianDist * 1.8 && p.dist > medianDist * 0.4);

        if (validPoints.length < 15) return null;

        // 3. 計算幾何中心 (Centroid)
        let sumX = 0, sumY = 0;
        for (let p of validPoints) { sumX += p.x; sumY += p.y; }
        const cx = sumX / validPoints.length;
        const cy = sumY / validPoints.length;
        
        // 4. 利用 PCA (主成分分析) 計算卡片傾斜角度
        let mu20 = 0, mu02 = 0, mu11 = 0;
        for (let p of validPoints) {
            const vx = p.x - cx;
            const vy = p.y - cy;
            mu20 += vx * vx;
            mu02 += vy * vy;
            mu11 += vx * vy;
        }
        
        // 找出主軸角度 (theta)
        const theta = 0.5 * Math.atan2(2 * mu11, mu20 - mu02);
        
        // 將數學角度轉換為 Canvas 的旋轉角度
        let rotation = Math.PI / 2 - theta;
        while (rotation > Math.PI / 2) rotation -= Math.PI;
        while (rotation < -Math.PI / 2) rotation += Math.PI;

        // 5. 反向旋轉計算精準寬度
        let minX = Infinity, maxX = -Infinity;
        const cosR = Math.cos(-rotation);
        const sinR = Math.sin(-rotation);
        
        for (let p of validPoints) {
            const tx = p.x - cx;
            const ty = p.y - cy;
            const rx = tx * cosR - ty * sinR; 
            if (rx < minX) minX = rx;
            if (rx > maxX) maxX = rx;
        }

        const detectedWidth = (maxX - minX) * (1 / processScale);
        let autoScale = detectedWidth / 170; 
        autoScale = Math.max(0.4, Math.min(autoScale, 3.0));

        return { 
            x: cx * (1 / processScale), 
            y: cy * (1 / processScale), 
            scale: autoScale, 
            rotation: rotation, // 新增：精準抓取傾斜角度
            width: detectedWidth 
        };
    }

    // AR 墨水渲染引擎
    function drawARInk() {
        if (!magicState.isRevealing) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (magicState.revealProgress < 1) magicState.revealProgress += 0.008; 
        const textOpacity = Math.min(magicState.revealProgress, 0.85);

        const x = magicState.targetX;
        const y = magicState.targetY;
        const isRed = magicState.suit === '♥' || magicState.suit === '♦';

        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = textOpacity;
        
        ctx.translate(x, y);
        ctx.rotate(magicState.rotation); // 完美套用傾斜角度
        ctx.scale(magicState.scale, magicState.scale);
        
        ctx.fillStyle = isRed ? '#cc0000' : '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText(magicState.value + magicState.suit, 0, 10);

        ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(magicState.value, -75, -110);
        ctx.font = '30px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(magicState.suit, -75, -80);
        
        ctx.save();
        ctx.rotate(Math.PI);
        ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(magicState.value, -75, -110);
        ctx.font = '30px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText(magicState.suit, -75, -80);
        ctx.restore();

        ctx.restore();

        if (magicState.revealProgress < 1) requestAnimationFrame(drawARInk);
    }

    // 右上角特效按鈕 (重置)
    triggerBtn.addEventListener('click', () => {
        if (magicState.isFrozen) {
            video.play();
            magicState.isFrozen = false;
        }
        magicState.isRevealing = false;
        magicState.revealProgress = 0;
        magicState.scale = 1; 
        magicState.rotation = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // 快門按鈕 (觸發魔法)
    document.getElementById('fake-shutter').addEventListener('click', () => {
        if (magicState.isFrozen) return;

        // 閃光燈特效
        const flash = document.createElement('div');
        flash.style.position = 'absolute'; flash.style.inset = '0';
        flash.style.backgroundColor = 'white'; flash.style.zIndex = '9999';
        flash.style.transition = 'opacity 0.3s ease-out';
        document.body.appendChild(flash);
        setTimeout(() => { flash.style.opacity = '0'; }, 10);
        setTimeout(() => { flash.remove(); }, 300);

        // 🚀 執行升級版 AI 運算 (抓取位置 + 傾斜角度)
        try {
            const autoDetected = autoDetectCardBounds(video, magicState.targetX, magicState.targetY, canvas.width, canvas.height);
            
            if (autoDetected && autoDetected.width > 60) {
                magicState.targetX = autoDetected.x;
                magicState.targetY = autoDetected.y;
                magicState.scale = autoDetected.scale;
                magicState.rotation = autoDetected.rotation; // 完美寫入角度
                console.log("自動對位成功，角度:", (autoDetected.rotation * 180 / Math.PI).toFixed(1));
            } else {
                console.warn("偵測範圍過小，回退為手動對位");
            }
        } catch (err) {
            console.warn("自動對位錯誤，採用手動座標", err);
        }

        // 凍結畫面
        video.pause();
        magicState.isFrozen = true;

        // 延遲 2 秒浮現墨水
        setTimeout(() => {
            magicState.isRevealing = true;
            magicState.revealProgress = 0;
            drawARInk();
        }, 2000); 
    });

    let usingFrontCamera = false;
    document.getElementById('flip-camera').addEventListener('click', () => {
        usingFrontCamera = !usingFrontCamera;
        startCamera(usingFrontCamera ? 'user' : 'environment');
    });

</script>
</body>
</html>
