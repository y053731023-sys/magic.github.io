<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心靈預言畫布 (四向變速版)</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; 
            /* 使用 100dvh (動態視口高度)，完美解決手機瀏覽器上下選單列遮擋問題 */
            height: 100dvh; 
            overflow: hidden; 
            background-color: #ffffff;
            touch-action: none; 
            user-select: none; 
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }

        /* 橫向螢幕鎖定遮罩 (強制直向) */
        #landscapeBlocker {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a1a;
            color: white;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            text-align: center;
        }
        @media screen and (orientation: landscape) {
            #landscapeBlocker { display: flex; }
        }
        
        /* 後台設定面板樣式 */
        #setupPanel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #888888;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            overflow: hidden;
        }
        
        /* 十字形佈局容器 */
        .cross-layout {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr 1fr; 
            grid-template-rows: 1fr 1.2fr 1.2fr 1fr;    
            gap: 10px;
            width: 92vw;        
            max-width: 420px;   
            height: 80vh;       
            max-height: 750px;
            margin: auto;
        }

        /* 退出後台的返回鈕 */
        #backBtn {
            position: absolute;
            top: env(safe-area-inset-top, 20px); 
            left: 20px;
            width: 45px; height: 45px;
            background-color: white;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #555;
            cursor: pointer;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            z-index: 30;
        }

        /* 右上角的陀螺儀授權鈕 */
        #authGyroBtn {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            right: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 30;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }

        /* 中央手機佈局區塊 */
        .center-phone {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .phone-graphic {
            width: 85%; height: 95%; 
            background: linear-gradient(135deg, #333 0%, #000 100%);
            border-radius: 20px;
            border: 2px solid #666;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 5px 5px 15px rgba(0,0,0,0.6);
            position: relative;
        }
        .phone-logo {
            position: absolute;
            top: 25%; left: 50%;
            transform: translateX(-50%);
            width: 25px; height: 30px;
            background-color: #ccc;
            border-radius: 50%;
            opacity: 0.8;
        }
        .tilt-arrow {
            position: absolute;
            color: #2196f3;
            font-size: clamp(20px, 8vw, 35px); 
            font-weight: bold;
            text-shadow: 0 0 8px rgba(33, 150, 243, 0.8);
            z-index: 10;
        }
        .arrow-top { top: -5%; left: 50%; transform: translateX(-50%) rotate(-90deg); }
        .arrow-bottom { bottom: -5%; left: 50%; transform: translateX(-50%) rotate(90deg); }
        .arrow-left { top: 50%; left: -5%; transform: translateY(-50%) rotate(180deg); }
        .arrow-right { top: 50%; right: -5%; transform: translateY(-50%) rotate(0deg); }

        /* 白色預言卡槽 */
        .slot {
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 5px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: all 0.2s;
            position: relative;
        }
        .slot:active { transform: scale(0.95); }

        .speed-icon {
            position: absolute;
            top: -10px; left: -10px;
            width: clamp(20px, 6vw, 28px);
            height: clamp(20px, 6vw, 28px);
            background: linear-gradient(135deg, #00e5ff, #00838f);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            font-size: clamp(10px, 3vw, 14px);
            z-index: 10;
        }

        .top-left { grid-column: 2; grid-row: 1; }
        .top-right { grid-column: 3; grid-row: 1; }
        .bottom-left { grid-column: 2; grid-row: 4; }
        .bottom-right { grid-column: 3; grid-row: 4; }
        .left-top { grid-column: 1; grid-row: 2; }
        .left-bottom { grid-column: 1; grid-row: 3; }
        .right-top { grid-column: 4; grid-row: 2; }
        .right-bottom { grid-column: 4; grid-row: 3; }

        .slot.dir-highlight {
            box-shadow: 0 0 15px 5px rgba(255, 235, 59, 0.8);
            border: 3px solid #ffeb3b;
        }
        .slot.targeted {
            box-shadow: 0 0 20px 8px rgba(255, 61, 0, 0.9) !important;
            border: 4px solid #ff3d00 !important;
            transform: scale(1.1);
        }
        
        /* 底部主畫布工具列 */
        #mainToolbar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 10px) + 20px); 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            gap: clamp(4px, 1.5vw, 12px);
            z-index: 15;
            width: max-content;
            max-width: 95vw;
        }

        /* 預言編輯工具列 */
        #editToolbar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 10px) + 20px);
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            background-color: rgba(50, 50, 50, 0.95);
            padding: 12px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            gap: 10px;
            z-index: 25;
            color: white;
            white-space: nowrap;
            max-width: 95vw;
        }

        /* 工具按鈕 */
        .tool-btn {
            width: clamp(28px, 8vw, 35px); 
            height: clamp(28px, 8vw, 35px);
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-size: clamp(12px, 3.5vw, 16px);
            transition: transform 0.1s;
            flex-shrink: 0; 
        }
        .tool-btn.active {
            border-color: #333;
            transform: scale(1.15);
        }
        .color-black { background-color: #000; }
        .color-red { background-color: #f44336; }
        .color-blue { background-color: #2196f3; }
        
        .size-btn { background-color: #e0e0e0; font-weight: bold; color: #333; }
        
        .divider {
            width: 1px; 
            height: clamp(20px, 6vw, 30px); 
            background: #ccc; 
            margin: 0 2px;
        }

        #paletteIcon {
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .edit-action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: clamp(12px, 3.5vw, 14px);
        }
        .btn-save { background-color: #4CAF50; color: white; }
        .btn-clear { background-color: #ff9800; color: white; }
        .btn-cancel { background-color: #f44336; color: white; }
    </style>
</head>
<body>

    <!-- 橫向螢幕鎖定遮罩 -->
    <div id="landscapeBlocker">
        <div style="font-size: 60px; margin-bottom: 20px; transform: rotate(90deg);">📱</div>
        <h2 style="margin: 0 0 10px 0;">請轉為直向</h2>
        <p style="color: #bbb; margin: 0; font-size: 16px;">為了獲得最佳體驗，<br>請將手機保持直立狀態。</p>
    </div>

    <!-- 底部主畫布工具列 (觀眾可見) -->
    <div id="mainToolbar">
        <!-- 調色盤圖示 (按兩下進入後台) -->
        <div id="paletteIcon" class="tool-btn" title="調色盤 (連按兩下設定)"></div>
        <div class="divider"></div>
        <!-- 顏色選擇 -->
        <div class="tool-btn color-black active" onclick="setColor('#000000', this)"></div>
        <div class="tool-btn color-red" onclick="setColor('#f44336', this)"></div>
        <div class="tool-btn color-blue" onclick="setColor('#2196f3', this)"></div>
        <div class="divider"></div>
        <!-- 粗細選擇 -->
        <div class="tool-btn size-btn active" onclick="setSize(4, this)">小</div>
        <div class="tool-btn size-btn" onclick="setSize(8, this)">中</div>
        <div class="tool-btn size-btn" onclick="setSize(16, this)">大</div>
        <div class="divider"></div>
        <!-- 清空觀眾畫布 -->
        <div class="tool-btn" style="background:#eee; font-size:18px;" onclick="clearMainCanvas()" title="清空">🗑️</div>
    </div>

    <!-- 編輯特定預言時的工具列 (僅魔術師可見) -->
    <div id="editToolbar">
        <span id="editTitle" style="font-weight: bold; margin-right: 5px;">編輯</span>
        <button class="edit-action-btn btn-clear" onclick="clearEditSlot()">清除</button>
        <button class="edit-action-btn btn-save" onclick="saveEditSlot()">儲存</button>
        <button class="edit-action-btn btn-cancel" onclick="cancelEditSlot()">取消</button>
    </div>

    <div id="setupPanel" style="display: none;">
        <!-- 返回按鈕 -->
        <div id="backBtn">↩</div>
        
        <!-- 陀螺儀授權 -->
        <button id="authGyroBtn">啟用陀螺儀</button>

        <!-- 響應式十字網格佈局 -->
        <div class="cross-layout" id="slotContainer">
            <div class="center-phone">
                <div class="tilt-arrow arrow-top">➔</div>
                <div class="tilt-arrow arrow-bottom">➔</div>
                <div class="tilt-arrow arrow-left">➔</div>
                <div class="tilt-arrow arrow-right">➔</div>
                <div class="phone-graphic">
                    <div class="phone-logo"></div>
                    <div style="position: absolute; bottom: 15%; width: 100%; text-align: center; color: #888; font-size: 10px;">iPhone</div>
                </div>
            </div>

            <div class="slot top-left" id="btnSlot1" onclick="openSlotEditor(1)"><div class="speed-icon">🐇</div></div>
            <div class="slot top-right" id="btnSlot0" onclick="openSlotEditor(0)"><div class="speed-icon">🐢</div></div>
            <div class="slot left-top" id="btnSlot5" onclick="openSlotEditor(5)"><div class="speed-icon">🐇</div></div>
            <div class="slot left-bottom" id="btnSlot4" onclick="openSlotEditor(4)"><div class="speed-icon">🐢</div></div>
            <div class="slot right-top" id="btnSlot7" onclick="openSlotEditor(7)"><div class="speed-icon">🐇</div></div>
            <div class="slot right-bottom" id="btnSlot6" onclick="openSlotEditor(6)"><div class="speed-icon">🐢</div></div>
            <div class="slot bottom-left" id="btnSlot3" onclick="openSlotEditor(3)"><div class="speed-icon">🐇</div></div>
            <div class="slot bottom-right" id="btnSlot2" onclick="openSlotEditor(2)"><div class="speed-icon">🐢</div></div>
        </div>
    </div>

    <canvas id="magicCanvas"></canvas>

    <script>
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch(function(error) {});
        }

        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        const setupPanel = document.getElementById('setupPanel');
        const authGyroBtn = document.getElementById('authGyroBtn');
        const mainToolbar = document.getElementById('mainToolbar');
        const editToolbar = document.getElementById('editToolbar');
        const paletteIcon = document.getElementById('paletteIcon');

        let isDrawing = false;
        let mode = 'performance'; 
        let savedPatterns = new Array(8).fill(null); 
        let flipState = 'UP'; 
        let targetRevealIndex = -1; 
        let isGyroActive = false;
        let editingSlotIndex = -1;  
        
        let currentDrawColor = '#000000';
        let currentDrawSize = 4;
        
        let currentDirection = 'FORWARD'; 
        // 移除原有的瞬時測速變數，改為基於時間的測量
        const LIFT_TIME_THRESHOLD = 500; // 抬起 10 度的時間判定標準 (毫秒)
        const labels = ["前 (慢)", "前 (快)", "仰 (慢)", "仰 (快)", "左 (慢)", "左 (快)", "右 (慢)", "右 (快)"];
        
        let longPressTimer;
        let pressStartX, pressStartY;
        
        // 紀錄手機反蓋時的最平角度與抬起起始時間
        let maxFacedownBeta = 0;
        let liftStartTime = 0;

        function resizeCanvas() {
            let tempCanvas = null;
            if (canvas.width > 0 && canvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);
            }

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            ctx.strokeStyle = currentDrawColor; 
            ctx.lineWidth = currentDrawSize;           
            ctx.lineCap = 'round';       
            ctx.lineJoin = 'round';
            
            if (tempCanvas) {
                ctx.drawImage(tempCanvas, 0, 0);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.setColor = function(color, element) {
            currentDrawColor = color;
            ctx.strokeStyle = color;
            document.querySelectorAll('.color-black, .color-red, .color-blue').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        };
        window.setSize = function(size, element) {
            currentDrawSize = size;
            ctx.lineWidth = size;
            document.querySelectorAll('.size-btn').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        };

        window.clearMainCanvas = function() {
            if (mode === 'performance') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                targetRevealIndex = -1;
            }
        };

        let lastTap = 0;
        paletteIcon.addEventListener('touchstart', (e) => {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            if (tapLength < 500 && tapLength > 0) {
                enterSetupMode();
                e.preventDefault();
            }
            lastTap = currentTime;
        });
        paletteIcon.addEventListener('dblclick', () => {
            enterSetupMode();
        });

        function enterSetupMode() {
            mode = 'setup';
            mainToolbar.style.display = 'none';
            setupPanel.style.display = 'flex';
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            startGyro(); 
            mode = 'performance';
            setupPanel.style.display = 'none';
            mainToolbar.style.display = 'flex'; 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            flipState = 'UP';
            targetRevealIndex = -1;
        });

        window.openSlotEditor = function(index) {
            editingSlotIndex = index;
            mode = 'edit_slot';
            setupPanel.style.display = 'none';
            editToolbar.style.display = 'flex';
            document.getElementById('editTitle').innerText = '編輯: ' + labels[index];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (savedPatterns[index]) {
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0); };
                img.src = savedPatterns[index];
            }
        };

        window.saveEditSlot = function() {
            const dataUrl = canvas.toDataURL('image/png');
            savedPatterns[editingSlotIndex] = dataUrl;
            
            const btn = document.getElementById('btnSlot' + editingSlotIndex);
            btn.style.backgroundImage = `url(${dataUrl})`;
            btn.classList.add('saved');
            
            exitSlotEditor();
        };

        window.clearEditSlot = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        window.cancelEditSlot = function() {
            exitSlotEditor();
        };

        function exitSlotEditor() {
            mode = 'setup';
            editToolbar.style.display = 'none';
            setupPanel.style.display = 'flex';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        authGyroBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') { startGyro(); setGyroBtnReady(); }
                }).catch(console.error);
            } else {
                startGyro(); setGyroBtnReady();
            }
        });

        function setGyroBtnReady() {
            authGyroBtn.innerText = '✅ 陀螺儀已啟用';
            authGyroBtn.style.backgroundColor = '#4CAF50';
        }

        function startGyro() {
            if (!isGyroActive) {
                window.addEventListener('deviceorientation', handleOrientation);
                isGyroActive = true;
            }
        }

        function calculateGyroDirection(beta, gamma) {
            // 【修正】：精確的 45 度分界判定邏輯
            // 若左右傾斜絕對值大於 45 度，視為左或右
            if (Math.abs(gamma) > 45) {
                return gamma < 0 ? 'LEFT' : 'RIGHT';
            } else {
                // 否則判斷前後。大於 45 度為仰 (BACKWARD)，小於等於 45 度為前 (FORWARD)
                return beta > 45 ? 'BACKWARD' : 'FORWARD';
            }
        }

        function handleOrientation(event) {
            let beta = event.beta; 
            let gamma = event.gamma;
            let now = Date.now();
            if (beta === null) return;

            // 靜態方位更新：手機未反蓋時持續更新黃光預判
            if (Math.abs(beta) < 80) {
                currentDirection = calculateGyroDirection(beta, gamma);
                if (mode === 'setup') updatePracticeDirectionUI();
            }

            if (mode === 'performance' || mode === 'setup') {
                let absBeta = Math.abs(beta);

                if (absBeta > 140 && flipState === 'UP') {
                    flipState = 'DOWN';
                    maxFacedownBeta = absBeta; 
                    liftStartTime = now;
                    
                    // 手機蓋下時，清空畫布
                    if (mode === 'performance') {
                        ctx.clearRect(0, 0, canvas.width, canvas.height); 
                    }
                } 
                else if (flipState === 'DOWN') {
                    // 在反蓋期間，持續更新「最平放」的角度 (可能高達 170~180度)
                    if (absBeta > maxFacedownBeta) {
                        maxFacedownBeta = absBeta;
                    }

                    // 只要還在最平放角度的 2 度內 (容許手微微顫抖)，就不斷重置抬起的起始時間
                    if (maxFacedownBeta - absBeta <= 2) {
                        liftStartTime = now;
                    }

                    // 【核心邏輯】：只要目前的角度比「最平角度」抬起超過 10 度，或者保底翻轉低於 80 度，就瞬間觸發變換
                    if ((maxFacedownBeta - absBeta > 10) || absBeta < 80) {
                        flipState = 'UP';
                        
                        // 計算這 10 度花費了多少時間
                        let liftDuration = now - liftStartTime;
                        
                        // 判定：少於 0.5 秒 (500ms) 就是快(兔子)，否則就是慢(烏龜)
                        let isFast = liftDuration < LIFT_TIME_THRESHOLD;
                        
                        // 兔子一翻就變 (10ms)，烏龜慢 0.5 秒 (500ms)
                        let delayTime = isFast ? 10 : 500;

                        setTimeout(() => {
                            let selectedIndex = getIndexFromDirectionAndSpeed(currentDirection, isFast);

                            if (mode === 'performance') {
                                if (targetRevealIndex === -1) {
                                    targetRevealIndex = selectedIndex;
                                }
                                revealPattern(targetRevealIndex);
                                targetRevealIndex = -1; 
                            } else if (mode === 'setup') {
                                showPracticeFeedback(selectedIndex, liftDuration);
                            }
                        }, delayTime);
                    }
                }
            }
        }

        function getIndexFromDirectionAndSpeed(dir, isFast) {
            let base = 0;
            if (dir === 'FORWARD') base = 0;
            else if (dir === 'BACKWARD') base = 2;
            else if (dir === 'LEFT') base = 4;
            else if (dir === 'RIGHT') base = 6;
            return base + (isFast ? 1 : 0);
        }

        function updatePracticeDirectionUI() {
            if (flipState === 'DOWN') return;
            for (let i = 0; i < 8; i++) document.getElementById('btnSlot' + i).classList.remove('dir-highlight');
            
            let base = getIndexFromDirectionAndSpeed(currentDirection, false);
            document.getElementById('btnSlot' + base).classList.add('dir-highlight');
            document.getElementById('btnSlot' + (base + 1)).classList.add('dir-highlight');
        }

        function showPracticeFeedback(index, liftDuration) {
            // 先清除所有紅框，再標記新的
            for (let i = 0; i < 8; i++) {
                document.getElementById('btnSlot' + i).classList.remove('targeted');
            }
            
            let btn = document.getElementById('btnSlot' + index);
            btn.classList.add('targeted');
            
            // 讓紅框保留 2 秒鐘，讓練習時有充裕時間確認結果
            setTimeout(() => {
                btn.classList.remove('targeted');
            }, 2000); 
            
            // 魔術師可透過瀏覽器開發者工具(Console)查看準確的毫秒數，方便練習手感
            console.log(`觸發格位: ${labels[index]}, 抬起 10 度耗時: ${liftDuration} 毫秒`);
        }

        function getPos(e) {
            if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function getGridIndex(x, y) {
            const col = x < canvas.width / 2 ? 0 : 1; 
            const row = Math.floor(y / (canvas.height / 4)); 
            return Math.max(0, Math.min(3, row)) * 2 + col;
        }

        function startDrawing(e) {
            if (e.target.closest('#mainToolbar')) return;
            if (e.target.closest('#editToolbar')) return;

            if (mode === 'performance' && e.touches && e.touches.length >= 2) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                targetRevealIndex = -1; 
                e.preventDefault(); return;
            }

            const pos = getPos(e);
            
            if (mode === 'performance' && flipState === 'DOWN') {
                targetRevealIndex = getGridIndex(pos.x, pos.y);
                e.preventDefault(); return;
            }

            if (mode === 'performance') {
                pressStartX = pos.x; pressStartY = pos.y;
                longPressTimer = setTimeout(() => {
                    targetRevealIndex = getGridIndex(pressStartX, pressStartY);
                    revealPattern(targetRevealIndex);
                    isDrawing = false; 
                }, 600);
            }

            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (e.target === canvas || mode === 'performance' || mode === 'edit_slot') e.preventDefault(); 
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            
            if (Math.abs(pos.x - pressStartX) > 10 || Math.abs(pos.y - pressStartY) > 10) {
                clearTimeout(longPressTimer);
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            if (e.target === canvas || mode === 'performance' || mode === 'edit_slot') e.preventDefault();
        }

        function stopDrawing() {
            clearTimeout(longPressTimer);
            if (isDrawing) { ctx.closePath(); isDrawing = false; }
        }

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        function revealPattern(index) {
            if (index < 0 || index > 7 || !savedPatterns[index]) return; 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            const img = new Image();
            img.onload = () => { ctx.drawImage(img, 0, 0); };
            img.src = savedPatterns[index];
        }

    </script>
</body>
</html>
