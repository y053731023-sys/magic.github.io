    <style>
        /* 引入魔法風格字體 Cinzel 和繁體中文 Noto Serif */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+TC:wght@300;600&display=swap');

        :root {
            --primary-glow: #fbbf24;
            --secondary-glow: #8b5cf6;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #020617;
            color: #e2e8f0;
            overflow-x: hidden;
            overscroll-behavior-y: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 背景星塵動畫 */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #020617 60%, #000000 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.5);
                box-shadow: 0 0 4px white;
            }
        }

        /* 標題字體 */
        h1,
        h2,
        .font-cinzel {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }

        /* 魔幻玻璃卡片 */
        .magic-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.2),
                0 20px 50px -10px rgba(0, 0, 0, 0.7),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* 卡片頂部光暈 */
        .magic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
            opacity: 0.5;
        }

        /* 數字網格 */
        .number-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .number-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 1rem;
            }
        }

        /* 數字單元格 */
        .number-cell {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
            text-align: center;
            padding: 0.6rem 0.2rem;
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            color: #fbbf24;
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid rgba(251, 191, 36, 0.1);
            transition: all 0.3s ease;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* 數字格微光效果 */
        .number-cell::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .number-cell:hover::after {
            opacity: 1;
        }

        /* 高級按鈕樣式 */
        .btn-magic {
            background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
            color: white;
            border: 1px solid #f59e0b;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-magic:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            filter: brightness(1.1);
        }

        .btn-magic::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-magic:hover::after {
            left: 100%;
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #94a3b8;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(30, 41, 59, 0.6);
            color: #f1f5f9;
            border-color: #64748b;
            box-shadow: 0 0 15px rgba(148, 163, 184, 0.1);
        }

        .btn-back {
            color: #64748b;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
        }

        .btn-back:hover {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            border-color: rgba(251, 191, 36, 0.2);
            transform: translateX(-3px);
        }

        /* 讀取動畫 */
        .mystic-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
            animation: spin var(--duration) cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .mystic-ring:nth-child(1) {
            height: 120px;
            width: 120px;
            --duration: 3s;
            border-top-color: #fbbf24;
            opacity: 0.8;
        }

        .mystic-ring:nth-child(2) {
            height: 90px;
            width: 90px;
            --duration: 2s;
            border-top-color: #d97706;
            opacity: 0.6;
        }

        .mystic-ring:nth-child(3) {
            height: 60px;
            width: 60px;
            --duration: 4s;
            border-top-color: #f59e0b;
            opacity: 0.4;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 進度點 */
        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            transition: all 0.4s ease;
            background: #334155;

        .dot.active {
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24, 0 0 5px #f59e0b;

        /* 動畫類別 */
        .fade-enter {
            opacity: 0;

            50% {
                opacity: 1;
            }

                <button onclick="resetGame()"
                    class="btn-magic px-10 py-3 rounded-full text-lg font-bold tracking-wider hover:scale-105 transform transition-transform font-cinzel flex items-center justify-center mx-auto gap-2">
                    <i class="fa-solid fa-rotate-right text-sm"></i>
                    <span>完成</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- Visual Effects Setup ---
        function initStars() {
            const container = document.getElementById('stars-container');
            const starCount = 50;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 2 + 1;
                const duration = Math.random() * 3 + 2;

                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);

                container.appendChild(star);
            }
        }
        initStars();

        // --- Game Logic (Identical to previous logic) ---
        let currentStep = 0;
        const totalCards = 6;
        let cardOrder = [];
        let userAnswers = [];

        const screens = {
            intro: document.getElementById('intro-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const numbersContainer = document.getElementById('numbers-container');
        const progressDotsContainer = document.getElementById('progress-dots');
        const secretAnswerDisplay = document.getElementById('secret-answer');

        function getNumbersForCard(cardIndex) {
            let numbers = [];
            let bitValue = Math.pow(2, cardIndex);
            for (let i = 1; i <= 63; i++) {
                if ((i & bitValue) !== 0) numbers.push(i);
            }
            return numbers; // Sorted
        }

        const mainHeader = document.getElementById('main-header');

        function switchScreen(screenName) {
            if (mainHeader) {
                if (screenName === 'intro') {
                    mainHeader.classList.remove('hidden');
                } else {
                    mainHeader.classList.add('hidden');
                }
            }
            Object.values(screens).forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('fade-enter-active');
            });
            const target = screens[screenName];
            target.classList.remove('hidden');
            void target.offsetWidth;
            target.classList.add('fade-enter');
            setTimeout(() => target.classList.add('fade-enter-active'), 50);
        }

        function startGame() {
            secretAnswerDisplay.innerText = '';
            currentStep = 0;
            userAnswers = new Array(totalCards).fill(null);
            cardOrder = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
            updateProgress();
            renderCard(currentStep);
            switchScreen('game');
        }

        function updateProgress() {
            progressDotsContainer.innerHTML = '';
            for (let i = 0; i < totalCards; i++) {
                const dot = document.createElement('div');
                dot.className = `dot ${i === currentStep ? 'active' : ''}`;
                // Keep completed dots slightly lit
                if (i < currentStep) dot.style.background = '#64748b';
                progressDotsContainer.appendChild(dot);
            }
        }

        function renderCard(stepIndex) {
            const realCardIndex = cardOrder[stepIndex];
            const numbers = getNumbersForCard(realCardIndex);

            numbersContainer.innerHTML = '';
            numbers.forEach((num, i) => {
                const div = document.createElement('div');
                div.className = 'number-cell opacity-0';
                div.innerText = num;
                // Elegant staggered animation
                div.style.animation = `fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards ${i * 0.02}s`;
                numbersContainer.appendChild(div);
            });
            updateProgress();
        }

        function answer(isYes) {
            createSparkles(event);
            userAnswers[currentStep] = isYes;
            currentStep++;

            if (currentStep < totalCards) {
                transitionToNextCard();
            } else {
                showResult();
            }
        }

        function goBack() {
            if (currentStep > 0) {
                currentStep--;
                transitionToNextCard();
            } else {
                switchScreen('intro');
            }
        }

        function transitionToNextCard() {
            const gameScreen = screens.game;
            gameScreen.style.transition = 'opacity 0.2s, transform 0.2s';
            gameScreen.style.opacity = '0';
            gameScreen.style.transform = 'scale(0.97) translateY(10px)';

            setTimeout(() => {
                renderCard(currentStep);
                gameScreen.style.opacity = '1';
                gameScreen.style.transform = 'scale(1) translateY(0)';
            }, 250);
        }

        function showResult() {
            let finalSum = 0;
            for (let i = 0; i < totalCards; i++) {
                if (userAnswers[i]) {
                    finalSum += Math.pow(2, cardOrder[i]);
                }
            }

            secretAnswerDisplay.innerText = finalSum;
            switchScreen('result');
        }

        function resetGame() {
            switchScreen('intro');
        }

        function createSparkles(e) {
            let x, y;
            if (e && e.clientX) {
                x = e.clientX;
                y = e.clientY;
            } else {
                const rect = document.body.getBoundingClientRect();
                x = rect.width / 2;
                y = rect.height / 2;
            }

            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';

                const size = Math.random() * 4 + 2;
                spark.style.width = size + 'px';
                spark.style.height = size + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 40;

                spark.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                spark.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 800);
            }
        }



        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.9); }
                to { opacity: 1; transform: scale(1); }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>

</html>
