<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>標準對數視力表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }
        .chart-font {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Heiti TC", sans-serif;
        }
        /* 極致炫彩樣式 */
        .rainbow-target {
            background-image: linear-gradient(to right, #ff0000, #ff9900, #33cc33, #3399ff, #9900cc);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0px 0px 15px rgba(255, 255, 255, 0.5);
        }
        .rainbow-chart {
            background-image: linear-gradient(to bottom right, #ff0080, #ff8c00, #40e0d0, #ba55d3);
            -webkit-background-clip: text;
            color: transparent;
        }
        .rainbow-header {
            background-image: linear-gradient(to right, #ff0080, #ba55d3);
            -webkit-background-clip: text;
            color: transparent;
        }
        .rainbow-line {
            background: linear-gradient(to right, #ff0080, #ba55d3);
        }

        /* 編輯模式動畫 */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { box-shadow: 0 0 0 4px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .editing-mode {
            animation: pulse-border 1.5s infinite;
            border-color: #eab308 !important;
            background-color: #fef08a !important;
            color: #854d0e !important;
        }

        /* 標題點擊反饋 */
        #main-title:active {
            opacity: 0.6;
        }
        
        /* 儲存中提示 */
        #save-indicator {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 12px;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 10px;
            border-radius: 99px;
            display: none;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center justify-center relative" id="main-body">

    <div id="save-indicator">同步中...</div>

    <!-- 頂部標題容器 -->
    <div id="header-container" class="w-full max-w-2xl mt-4 text-center z-50 origin-top">
        <h1 id="main-title" class="text-2xl sm:text-4xl font-bold tracking-[0.3em] text-gray-800 mb-1 cursor-pointer">標準對數視力表</h1>
        <div id="title-line" class="h-[3px] bg-gray-800 w-[80%] sm:w-[60%] mx-auto mb-2"></div>
    </div>

    <!-- 視力表主體容器 -->
    <div id="chart-wrapper" class="w-full flex-grow flex items-center justify-center overflow-hidden relative">
        <div id="chart-container" class="w-full flex flex-col items-center pointer-events-none origin-top chart-font">
            <!-- 內容動態生成 -->
        </div>
    </div>

    <!-- 全區觸控隱形區 -->
    <div id="secret-zone-left" class="hidden fixed top-0 left-0 w-[30%] h-full z-40 bg-transparent"></div>
    <div id="secret-zone-right" class="hidden fixed top-0 right-0 w-[70%] h-full z-40 bg-transparent"></div>

    <!-- 控制面板 (後台) -->
    <div id="control-panel" class="hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-10px_40px_rgba(0,0,0,0.4)] p-5 sm:p-8 rounded-t-[2.5rem] z-[60] max-w-2xl mx-auto border-t border-gray-200 max-h-[80vh] flex flex-col">
        
        <div class="flex justify-between items-center mb-5 flex-shrink-0">
            <div class="flex items-center">
                <span class="text-xl font-bold text-gray-900 mr-2">表演配置後台</span>
                <span class="px-2 py-0.5 bg-gray-100 text-gray-400 text-[9px] rounded uppercase tracking-tighter">Persistence Active</span>
            </div>
            <button id="btn-enter-magic" class="text-xs sm:text-sm bg-blue-600 text-white px-8 py-3 rounded-full font-bold shadow-lg active:scale-95 transition-all">
                確認並開始表演
            </button>
        </div>

        <!-- 操作說明 -->
        <div class="mb-5 bg-blue-50 p-4 rounded-2xl border border-blue-100 text-[11px] text-blue-700 leading-relaxed">
            <p>🔒 <b>長按標題 1.5 秒</b>：喚出後台。設定已<b>自動同步至雲端</b>。</p>
            <p>🎯 <b>觸發方式</b>：螢幕【中右側】下一步，【左邊緣】上一步。</p>
        </div>

        <!-- 流程顯示區 -->
        <div class="mb-5 bg-gray-50 p-4 rounded-2xl border border-gray-200 flex-shrink-0">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-gray-600">觸發順序：</span>
                <div class="space-x-2">
                    <button id="btn-clear-seq" class="text-[10px] text-red-500 font-bold hover:underline">清空全部</button>
                    <button id="btn-default-seq" class="text-[10px] text-blue-500 font-bold hover:underline">恢復預設</button>
                </div>
            </div>
            <div id="sequence-display" class="flex flex-wrap gap-2 min-h-[50px] items-center overflow-y-auto max-h-40 p-1"></div>
        </div>
        
        <!-- 特效池 -->
        <div class="flex-grow overflow-y-auto pr-1">
            <span id="pool-instruction" class="text-[10px] font-bold text-gray-400 mb-3 block uppercase tracking-widest">點擊按鈕加入效果：</span>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2.5" id="effect-pool">
                <button data-effect="0" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">向右</button>
                <button data-effect="1" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">轉向下</button>
                <button data-effect="2" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">變「上」</button>
                <button data-effect="3" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">輕度模糊</button>
                <button data-effect="4" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-red-700 shadow-sm active:bg-gray-100">重度模糊</button>
                <button data-effect="5" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">清晰恢復</button>
                <button data-effect="6" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">散光重影</button>
                <button data-effect="7" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-purple-700 shadow-sm active:bg-gray-100">歪七扭八</button>
                <button data-effect="8" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-white border border-gray-200 text-gray-700 shadow-sm active:bg-gray-100">超級放大</button>
                <button data-effect="9" class="pool-btn py-3.5 text-[11px] font-bold rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white border-none shadow-md active:opacity-80">炫彩視界</button>
            </div>
        </div>

        <button id="btn-close-panel" class="mt-4 py-3 text-xs text-gray-400 font-bold border-t border-gray-100">暫時關閉後台</button>
    </div>

    <!-- 隱蔽的退出按鈕 -->
    <div id="exit-magic-container" class="hidden fixed top-2 right-2 z-50">
        <button id="btn-exit-magic" class="w-8 h-8 opacity-0">退出</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 配置 (從環境變數取得)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'magic-eye-app';

        let userId = null;
        const saveIndicator = document.getElementById('save-indicator');

        const rotationMap = { up: '-rotate-90', down: 'rotate-90', left: 'rotate-180', right: 'rotate-0' };
        const chartData = [
            { size: 'text-[22vmin]', gap: 'gap-[5vmin]', items: ['right'] },
            { size: 'text-[17vmin]', gap: 'gap-[5vmin]', items: ['up', 'down'] },
            { size: 'text-[13vmin]', gap: 'gap-[4vmin]', items: ['left', 'up', 'right'] },
            { size: 'text-[10vmin]', gap: 'gap-[3vmin]', items: ['down', 'left', 'up', 'right'] },
            { size: 'text-[7.5vmin]', gap: 'gap-[2.5vmin]', items: ['right', 'down', 'left', 'up', 'down'] },
            { size: 'text-[5.5vmin]', gap: 'gap-[2vmin]', items: ['up', 'right', 'down', 'left', 'up', 'right'] },
            { size: 'text-[4vmin]', gap: 'gap-[1.5vmin]', items: ['left', 'up', 'right', 'down', 'left', 'up', 'right'] },
        ];
        const effectNames = ["向右", "轉向下", "變「上」", "輕度模糊", "重度模糊", "清晰恢復", "散光重影", "歪七扭八", "超級放大", "炫彩視界"];
        
        let customSequence = [0, 1, 2, 3, 5, 6, 8, 9]; 
        let currentStepIndex = 0;
        let editingIndex = -1; 
        let magicMode = false;

        const headerContainer = document.getElementById('header-container');
        const mainTitle = document.getElementById('main-title');
        const titleLine = document.getElementById('title-line');
        const chartContainer = document.getElementById('chart-container');
        const controlPanel = document.getElementById('control-panel');
        const sequenceDisplay = document.getElementById('sequence-display');
        const poolInstruction = document.getElementById('pool-instruction');

        // --- 雲端儲存與載入邏輯 ---
        const saveConfig = async () => {
            if (!userId) return;
            saveIndicator.style.display = 'block';
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'config', 'sequence'), {
                    data: customSequence,
                    updatedAt: Date.now()
                });
            } catch (err) {
                console.error("儲存失敗", err);
            } finally {
                setTimeout(() => { saveIndicator.style.display = 'none'; }, 500);
            }
        };

        const loadConfig = async (uid) => {
            try {
                const snap = await getDoc(doc(db, 'artifacts', appId, 'users', uid, 'config', 'sequence'));
                if (snap.exists()) {
                    customSequence = snap.data().data;
                    updateVisuals();
                }
            } catch (err) {
                console.error("載入失敗", err);
            }
        };

        // --- Firebase 認證初始化 ---
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                loadConfig(userId);
            }
        });

        initAuth();

        // --- 核心長按邏輯 ---
        let longPressTimer;
        const triggerBackstage = () => {
            controlPanel.classList.remove('hidden');
            magicMode = false;
            updateVisuals();
        };

        mainTitle.addEventListener('mousedown', () => { longPressTimer = setTimeout(triggerBackstage, 1500); });
        mainTitle.addEventListener('touchstart', (e) => { 
            longPressTimer = setTimeout(triggerBackstage, 1500);
        }, { passive: true });

        const cancelLongPress = () => clearTimeout(longPressTimer);
        window.addEventListener('mouseup', cancelLongPress);
        window.addEventListener('touchend', cancelLongPress);
        window.addEventListener('touchmove', cancelLongPress);

        window.renderChart = function() {
            chartContainer.innerHTML = ''; 
            chartData.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = `flex justify-center items-center ${row.gap} my-[1vmin]`;
                row.items.forEach((dir, colIndex) => {
                    const charDiv = document.createElement('div');
                    charDiv.className = `flex justify-center items-center w-[1em] h-[1em] leading-none font-black ${row.size}`;
                    const spanEl = document.createElement('span');
                    spanEl.innerText = 'E';
                    spanEl.className = `inline-block ${rotationMap[dir]}`;
                    spanEl.setAttribute('data-dir', dir);
                    if (rowIndex === 0 && colIndex === 0) spanEl.id = 'target-e';
                    else spanEl.classList.add('other-e'); 
                    charDiv.appendChild(spanEl);
                    rowDiv.appendChild(charDiv);
                });
                chartContainer.appendChild(rowDiv);
            });
        }

        window.renderSequenceUI = function() {
            sequenceDisplay.innerHTML = '';
            if (editingIndex > -1) {
                poolInstruction.innerText = `🔄 請選擇要替換第 ${editingIndex + 1} 步的效果：`;
                poolInstruction.className = "text-[10px] font-bold text-yellow-600 mb-3 block bg-yellow-50 px-2 py-1 rounded";
            } else {
                poolInstruction.innerText = "點擊下方加入效果：";
                poolInstruction.className = "text-[10px] font-bold text-gray-400 mb-3 block";
            }
            customSequence.forEach((effId, idx) => {
                const span = document.createElement('span');
                const isCurrent = idx === currentStepIndex;
                const isEditing = idx === editingIndex;
                let baseClass = "pl-2 pr-1 py-2 rounded-xl text-[10px] sm:text-xs font-bold flex items-center transition-all border ";
                
                if (isEditing) span.className = baseClass + "editing-mode bg-yellow-50 border-yellow-400 text-yellow-800";
                else if (isCurrent) span.className = baseClass + "bg-blue-600 text-white border-blue-700 shadow-md";
                else span.className = baseClass + "bg-white text-gray-700 border-gray-200";
                
                const textNode = document.createElement('span');
                textNode.innerHTML = `<span class="opacity-30 mr-1">${idx+1}.</span>${effectNames[effId]}`;
                textNode.className = "cursor-pointer mr-1";
                textNode.onclick = () => { currentStepIndex = idx; editingIndex = (editingIndex === idx) ? -1 : idx; updateVisuals(); };
                span.appendChild(textNode);

                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&times;';
                delBtn.className = "ml-1 w-5 h-5 rounded-full flex items-center justify-center transition-colors " + (isCurrent ? "bg-white/20 text-white" : "bg-gray-100 text-gray-400");
                delBtn.onclick = (e) => {
                    e.stopPropagation(); customSequence.splice(idx, 1); 
                    if (editingIndex === idx) editingIndex = -1; else if (editingIndex > idx) editingIndex--;
                    if (currentStepIndex >= customSequence.length) currentStepIndex = Math.max(0, customSequence.length - 1);
                    updateVisuals();
                    saveConfig(); // 儲存異動
                };
                span.appendChild(delBtn);
                sequenceDisplay.appendChild(span);
            });
        }

        window.updateVisuals = function() {
            const currentEffectId = (customSequence.length > 0) ? customSequence[currentStepIndex] : 0;
            const targetE = document.getElementById('target-e');
            const otherEs = document.querySelectorAll('.other-e');
            
            headerContainer.className = "w-full max-w-2xl mt-4 text-center z-50 origin-top";
            mainTitle.className = "text-2xl sm:text-4xl font-bold tracking-[0.3em] text-gray-800 mb-1 cursor-pointer";
            titleLine.className = "h-[3px] bg-gray-800 w-[80%] sm:w-[60%] mx-auto mb-2";
            chartContainer.className = "w-full flex flex-col items-center pointer-events-none origin-top chart-font text-black";
            
            let targetText = "E";
            let targetEClass = "inline-block font-black "; 
            if(targetE) { targetE.style.transform = ''; targetE.style.opacity = '1'; targetE.style.filter = 'none'; }

            otherEs.forEach(el => {
                const originalDir = el.getAttribute('data-dir');
                el.className = `other-e inline-block ${rotationMap[originalDir]} text-black`;
                el.style.transform = ''; el.style.opacity = '1'; el.style.filter = 'none'; el.innerText = 'E'; 
            });

            if (currentEffectId === 0) targetEClass += rotationMap['right'];
            else if (currentEffectId === 1) targetEClass += rotationMap['down']; 
            else if (currentEffectId === 2) { targetText = "上"; targetEClass += rotationMap['right']; } 
            else if (currentEffectId === 3) { targetEClass += rotationMap['right']; chartContainer.classList.add('blur-[3px]', 'opacity-90'); } 
            else if (currentEffectId === 4) { targetEClass += rotationMap['right']; chartContainer.classList.add('blur-[10px]', 'opacity-70'); }
            else if (currentEffectId === 5) targetEClass += rotationMap['right']; 
            else if (currentEffectId === 6) { targetEClass += rotationMap['right']; chartContainer.classList.add('drop-shadow-[5px_3px_2px_rgba(0,0,0,0.5)]', '-skew-x-3', 'scale-105'); } 
            else if (currentEffectId === 7) { 
                targetEClass += rotationMap['right']; 
                otherEs.forEach(el => { 
                    const r = (Math.random() - 0.5) * 240; 
                    const tx = (Math.random() - 0.5) * 80; 
                    const ty = (Math.random() - 0.5) * 80;
                    const skX = (Math.random() - 0.5) * 100;
                    const skY = (Math.random() - 0.5) * 100;
                    const s = Math.random() * 0.8 + 0.4; 
                    el.style.transform = `translate(${tx}px, ${ty}px) rotate(${r}deg) skew(${skX}deg, ${skY}deg) scale(${s})`;
                    el.style.opacity = Math.random() * 0.7 + 0.3;
                });
                targetE.style.transform = `rotate(${(Math.random() - 0.5) * 60}deg) skew(${(Math.random() - 0.5) * 30}deg) scale(0.8)`;
            } 
            else if (currentEffectId === 8) { 
                targetEClass += rotationMap['right']; 
                chartContainer.classList.add('scale-[1.8]'); headerContainer.classList.add('scale-[1.3]'); 
            } 
            else if (currentEffectId === 9) {
                targetEClass += rotationMap['right']; targetEClass += ' rainbow-target'; 
                mainTitle.classList.add('rainbow-header'); 
                titleLine.classList.add('rainbow-line');
                otherEs.forEach(el => { el.classList.remove('text-black'); el.classList.add('rainbow-chart'); });
            }

            if(targetE) { targetE.className = targetEClass; targetE.innerText = targetText; }
            window.renderSequenceUI(); 
        }

        function nextStep() { if (customSequence.length === 0) return; currentStepIndex = (currentStepIndex + 1) % customSequence.length; window.updateVisuals(); }
        function prevStep() { if (customSequence.length === 0) return; currentStepIndex = (currentStepIndex - 1 + customSequence.length) % customSequence.length; window.updateVisuals(); }

        document.querySelectorAll('.pool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const effId = parseInt(e.currentTarget.getAttribute('data-effect'));
                if (editingIndex > -1) { customSequence[editingIndex] = effId; editingIndex = -1; } 
                else { customSequence.push(effId); currentStepIndex = customSequence.length - 1; }
                window.updateVisuals();
                saveConfig(); // 儲存異動
            });
        });

        document.getElementById('btn-clear-seq').addEventListener('click', () => { 
            customSequence = []; 
            currentStepIndex = 0; 
            window.updateVisuals(); 
            saveConfig();
        });
        
        document.getElementById('btn-default-seq').addEventListener('click', () => { 
            customSequence = [0, 1, 2, 3, 5, 6, 8, 9]; 
            currentStepIndex = 0; 
            window.updateVisuals(); 
            saveConfig();
        });
        
        document.getElementById('btn-close-panel').addEventListener('click', () => controlPanel.classList.add('hidden'));

        document.getElementById('btn-enter-magic').addEventListener('click', () => {
            if (customSequence.length === 0) return;
            magicMode = true;
            currentStepIndex = 0;
            editingIndex = -1;
            window.updateVisuals();
            controlPanel.classList.add('hidden');
            document.getElementById('secret-zone-right').classList.remove('hidden'); 
            document.getElementById('secret-zone-left').classList.remove('hidden');
        });

        const zoneRight = document.getElementById('secret-zone-right');
        const zoneLeft = document.getElementById('secret-zone-left');
        const handleInteraction = (type) => {
            if(!magicMode) return;
            if(type === 'next') nextStep();
            else prevStep();
        };

        zoneRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction('next'); });
        zoneRight.addEventListener('mousedown', () => handleInteraction('next'));
        zoneLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction('prev'); });
        zoneLeft.addEventListener('mousedown', () => handleInteraction('prev'));

        window.renderChart(); 
        window.updateVisuals();
    </script>
</body>
</html>
