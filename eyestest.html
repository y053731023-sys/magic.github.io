```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔術互動視力表</title>
    <!-- 引入 Tailwind CSS 以快速套用樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏捲軸並禁止文字選取以防止表演時誤觸 */
        body {
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center relative" id="main-body">

    <!-- 隱藏的無聲音檔，用於監聽系統音量鍵變化 -->
    <audio id="silent-audio" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" loop playsinline style="display: none;"></audio>

    <!-- 頂部標題 -->
    <div class="w-full max-w-md mt-6 text-center z-0">
        <h1 class="text-xl font-bold tracking-[0.3em] text-gray-800 mb-1">標準對數視力表</h1>
        <div class="h-[2px] bg-gray-800 w-3/4 mx-auto mb-2"></div>
    </div>

    <!-- 視力表主體容器 -->
    <div id="chart-container" class="flex-grow w-full max-w-md transition-all duration-700 ease-in-out flex flex-col items-center pt-8 pb-12 text-black z-0">
        <!-- 視力表內容將透過 JavaScript 動態生成 -->
    </div>

    <!-- 魔術模式：全螢幕初始化遮罩 -->
    <div id="magic-overlay" class="hidden absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-50 backdrop-blur-sm cursor-pointer">
        <div class="bg-white p-8 rounded-2xl text-center max-w-[80%] shadow-2xl transform transition-transform hover:scale-105 active:scale-95 pointer-events-none">
            <span class="text-5xl mb-4 block">👆</span>
            <h2 class="font-bold text-gray-800 text-xl mb-2">點擊這裡開始</h2>
            <p class="text-sm text-gray-500">點擊後遮罩將消失<br>即可使用「音量鍵」或「點擊螢幕」表演</p>
        </div>
    </div>

    <!-- 控制面板 (觀眾看不到) -->
    <div id="control-panel" class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 rounded-t-2xl z-10 max-w-md mx-auto border-t border-gray-200">
        <div class="flex justify-between items-center mb-4">
            <span class="text-sm font-semibold text-gray-600">控制面板 (觀眾看不到)</span>
            <button id="btn-enter-magic" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full font-medium hover:bg-red-200 transition-colors">
                進入魔術模式
            </button>
        </div>
        
        <div class="grid grid-cols-3 gap-2" id="step-buttons">
            <button data-step="0" class="step-btn py-2 px-1 text-sm rounded transition-colors bg-blue-600 text-white">1. 正常</button>
            <button data-step="1" class="step-btn py-2 px-1 text-sm rounded transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200">2. 改變方向</button>
            <button data-step="2" class="step-btn py-2 px-1 text-sm rounded transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200">3. 近視模糊</button>
            <button data-step="3" class="step-btn py-2 px-1 text-sm rounded transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200">4. 恢復清晰</button>
            <button data-step="4" class="step-btn py-2 px-1 text-sm rounded transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200">5. 散光誤差</button>
            <button data-step="5" class="step-btn py-2 px-1 text-sm rounded transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200">6. 絢麗色彩</button>
        </div>
        
        <button id="btn-next-step" class="w-full mt-3 bg-gray-800 text-white py-3 rounded-lg font-medium hover:bg-gray-900 transition-colors shadow-sm">
            下一步 ➡️
        </button>
    </div>

    <!-- 魔術模式下的退出按鈕 -->
    <div id="exit-magic-container" class="hidden fixed top-2 right-2 flex-col items-end z-20">
        <button id="btn-exit-magic" class="text-[10px] bg-black/5 text-black/30 px-2 py-1 rounded mb-1 backdrop-blur-sm hover:bg-black/10">
            退出魔術
        </button>
    </div>

    <script>
        // 定義方向對應的旋轉角度 (Tailwind classes)
        const rotationMap = {
            up: '-rotate-90',
            down: 'rotate-90',
            left: 'rotate-180',
            right: 'rotate-0',
        };

        // 視力表排版資料
        const chartData = [
            { size: 'text-6xl sm:text-8xl', gap: 'gap-8', items: ['up'] },
            { size: 'text-5xl sm:text-7xl', gap: 'gap-8', items: ['right', 'down'] },
            { size: 'text-4xl sm:text-6xl', gap: 'gap-6', items: ['left', 'up', 'right'] },
            { size: 'text-3xl sm:text-5xl', gap: 'gap-5', items: ['down', 'left', 'up', 'right'] },
            { size: 'text-2xl sm:text-4xl', gap: 'gap-4', items: ['right', 'down', 'left', 'up', 'down'] },
            { size: 'text-xl sm:text-3xl', gap: 'gap-3', items: ['up', 'right', 'down', 'left', 'up', 'right'] },
            { size: 'text-lg sm:text-2xl', gap: 'gap-2', items: ['left', 'up', 'right', 'down', 'left', 'up', 'right'] },
        ];

        // 系統狀態變數
        let step = 0;
        let magicMode = false;
        let audioInitialized = false;
        const stepsCount = 6;
        let volumeTimeout;

        // DOM 元素參考
        const chartContainer = document.getElementById('chart-container');
        const mainBody = document.getElementById('main-body');
        const controlPanel = document.getElementById('control-panel');
        const magicOverlay = document.getElementById('magic-overlay');
        const exitMagicContainer = document.getElementById('exit-magic-container');
        const audioEl = document.getElementById('silent-audio');
        const stepButtons = document.querySelectorAll('.step-btn');

        // 1. 初始化生成視力表 HTML
        function renderChart() {
            chartContainer.innerHTML = ''; // 清空內容
            
            chartData.forEach((row, rowIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = `flex justify-center items-center ${row.gap} my-2`;
                
                row.items.forEach((dir, colIndex) => {
                    const charDiv = document.createElement('div');
                    charDiv.className = `flex justify-center items-center w-[1em] h-[1em] leading-none font-black ${row.size} transition-transform duration-500 ease-in-out`;
                    
                    const spanEl = document.createElement('span');
                    spanEl.innerText = 'E';
                    spanEl.className = `inline-block ${rotationMap[dir]} transition-all duration-500`;
                    
                    // 標記魔術的目標 E 字 (第一排第一個)
                    if (rowIndex === 0 && colIndex === 0) {
                        spanEl.id = 'target-e';
                    }

                    charDiv.appendChild(spanEl);
                    rowDiv.appendChild(charDiv);
                });
                
                chartContainer.appendChild(rowDiv);
            });
        }

        // 2. 根據目前步驟更新視覺效果
        function updateVisuals() {
            const targetE = document.getElementById('target-e');
            
            // 重置容器與目標E的基礎樣式
            chartContainer.className = "flex-grow w-full max-w-md transition-all duration-700 ease-in-out flex flex-col items-center pt-8 pb-12";
            let targetEClass = "inline-block transition-all duration-500 ease-in-out ";
            
            // 步驟 1: 改變方向
            if (step >= 1) {
                targetEClass += rotationMap['right']; // 轉向右邊
            } else {
                targetEClass += rotationMap['up']; // 預設朝上
            }

            // 步驟 2~5: 濾鏡與色彩變化
            if (step === 2) {
                chartContainer.classList.add('blur-[6px]', 'opacity-80', 'text-black');
            } else if (step === 3) {
                chartContainer.classList.add('blur-none', 'opacity-100', 'text-black');
            } else if (step === 4) {
                chartContainer.classList.add('drop-shadow-[3px_2px_1px_rgba(0,0,0,0.5)]', '-skew-x-3', 'scale-105', 'text-black');
            } else if (step === 5) {
                chartContainer.classList.add('hue-rotate-90', 'saturate-200', 'text-purple-600', 'drop-shadow-[2px_2px_4px_rgba(255,0,255,0.6)]');
                targetEClass += ' bg-clip-text text-transparent bg-gradient-to-br from-pink-500 via-purple-500 to-indigo-500';
            } else {
                chartContainer.classList.add('text-black');
            }

            // 套用目標 E 字的樣式
            if(targetE) targetE.className = targetEClass;

            // 更新控制面板按鈕狀態
            stepButtons.forEach((btn, idx) => {
                if (idx === step) {
                    btn.className = "step-btn py-2 px-1 text-sm rounded transition-colors bg-blue-600 text-white";
                } else {
                    btn.className = "step-btn py-2 px-1 text-sm rounded transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200";
                }
            });
        }

        // 3. 推進下一步驟
        function nextStep() {
            step = (step + 1) % stepsCount;
            updateVisuals();
        }

        // 4. 事件監聽綁定
        
        // 進入魔術模式
        document.getElementById('btn-enter-magic').addEventListener('click', (e) => {
            e.stopPropagation();
            magicMode = true;
            audioInitialized = false;
            controlPanel.classList.add('hidden');
            magicOverlay.classList.remove('hidden');
            exitMagicContainer.classList.add('hidden');
            step = 0; // 重置狀態
            updateVisuals();
        });

        // 退出魔術模式
        document.getElementById('btn-exit-magic').addEventListener('click', (e) => {
            e.stopPropagation();
            magicMode = false;
            controlPanel.classList.remove('hidden');
            exitMagicContainer.classList.add('hidden');
        });

        // 控制面板下一步
        document.getElementById('btn-next-step').addEventListener('click', (e) => {
            e.stopPropagation();
            nextStep();
        });

        // 控制面板特定步驟點擊
        stepButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                step = parseInt(btn.getAttribute('data-step'));
                updateVisuals();
            });
        });

        // 解除魔術遮罩並初始化音訊 (關鍵步驟)
        magicOverlay.addEventListener('click', (e) => {
            e.stopPropagation();
            magicOverlay.classList.add('hidden');
            audioInitialized = true;
            exitMagicContainer.classList.remove('hidden');

            // 嘗試播放無聲音檔以啟用音量監聽
            audioEl.play().catch(err => {
                console.log("音訊自動播放被阻擋，但點擊觸發仍可運作", err);
            });
        });

        // 魔術模式下：點擊螢幕任何空白處觸發下一步
        mainBody.addEventListener('click', () => {
            if (magicMode && audioInitialized) {
                nextStep();
            }
        });

        // 魔術模式下：監聽實體音量鍵變化
        audioEl.addEventListener('volumechange', () => {
            if (!magicMode || !audioInitialized) return;
            
            // 使用 debounce 防止按一次觸發太多次
            clearTimeout(volumeTimeout);
            volumeTimeout = setTimeout(() => {
                nextStep();
            }, 250);
        });

        // 初始執行
        renderChart();
        updateVisuals();

    </script>
</body>
</html>

```
