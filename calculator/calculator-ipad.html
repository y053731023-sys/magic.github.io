        };

            document.body.innerHTML += '<div style="background:white;color:red;padding:20px;position:relative;z-index:9999;font-size:16px;word-wrap:break-word;">Promise Error: ' + event.reason + '</div>';
        });

    }

      opacity: 0.5;
    }

    <style>
        body {
            background-color: #000;
            color: white;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #000;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .ease-ios {
            transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1);
        }

        .btn-press {
            transition: filter 0.1s, transform 0.05s;
        }

        .btn-num-press:active {
            filter: brightness(1.6);
        }

        .btn-func-press:active {
            filter: brightness(0.7);
        }

        .btn-op-press:active {
            filter: brightness(0.8);
            opacity: 0.8;
        }

        .backdrop-blur-xl {
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom, 34px);
        }

        /* Full-viewport iPad layout; no simulated device frame. */
        html, body, #root { margin: 0; width: 100%; height: 100%; }
        body { touch-action: manipulation; }
        .calculator-app { height: 100vh; height: 100dvh; width: 100%; background: #000; overflow: hidden; }
        .calculator-shell {
            --toolbar-top: calc(max(24px, env(safe-area-inset-top, 0px)) + 16px);
            --edge: clamp(16px, 5.35vw, 80px);
            --gap: clamp(10px, 1.95vw, 28px);
            --key-font: clamp(28px, 5.55vw, 80px);
            width: 100%; height: 100%; position: relative; display: grid;
            grid-template-rows: auto minmax(0, 1fr) minmax(0, 51.3%);
            padding-bottom: max(16px, 3.7vh, env(safe-area-inset-bottom));
            padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
            overflow: hidden; background: #000;
        }
        .calculator-toolbar { display: flex; justify-content: space-between; position: relative; z-index: 40;
            padding: var(--toolbar-top) clamp(12px, 1.25vw, 24px) 0; }
        .toolbar-button { width: clamp(44px, 5.7vw, 78px); height: clamp(44px, 5.7vw, 78px);
            border: 1px solid #303030; background: #202020; touch-action: none; }
        .toolbar-button svg { width: 60%; height: 60%; }
        .backend-trigger { top: var(--toolbar-top); height: 48px; touch-action: none; }
        .calculator-display { min-height: 0; overflow: hidden; padding-bottom: clamp(12px, 2.1vh, 32px); }
        .main-display, .previous-display { flex-shrink: 0; padding-right: var(--edge); padding-left: var(--edge); }
        .main-display { font-size: clamp(64px, 12vw, 174px); font-weight: 400; line-height: 1.12; }
        .main-display.display-long { font-size: clamp(42px, 8.5vw, 122px); }
        .previous-display { font-size: clamp(18px, 2.8vw, 38px); min-height: 1.3em; }
        .calculator-keypad { padding: 0 var(--edge); min-height: 0; }
        .keypad-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: var(--gap); height: 100%; }
        .calculator-key { min-height: 0; min-width: 0; height: 100%; border-radius: 999px; aspect-ratio: auto;
            font-size: var(--key-font); font-weight: 400; border: 1px solid #ffffff12;
            box-shadow: inset 0 1px 2px #ffffff14; touch-action: manipulation; }
        .calculator-key.btn-op-press { font-size: calc(var(--key-font) * 1.25); background-color: #ff9500; }
        .calculator-key svg { width: 1em; height: 1em; }
        .settings-overlay { padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom)); touch-action: pan-y; }
        .settings-card { max-width: 480px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
        .settings-card input { user-select: text; -webkit-user-select: text; }
        @media (max-width: 600px) {
            .calculator-shell { --edge: 16px; --gap: 10px; grid-template-rows: auto minmax(0, 1fr) minmax(0, 58%); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
        }
        @media (orientation: landscape) {
            .calculator-shell { --toolbar-top: calc(max(12px, env(safe-area-inset-top, 0px)) + 8px); }
            .calculator-shell { --edge: clamp(16px, 5vw, 80px); --gap: clamp(8px, 1.6vh, 16px); --key-font: clamp(22px, 5.6vh, 52px);
                grid-template-rows: auto minmax(0, 1fr) minmax(0, 63%); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
            .toolbar-button { width: 44px; height: 44px; }
            .calculator-display { padding-bottom: 8px; }
            .main-display { font-size: clamp(36px, 10vh, 100px); }
            .main-display.display-long { font-size: clamp(30px, 8vh, 80px); }
            .previous-display { font-size: clamp(14px, 2.8vh, 24px); }
        }
    </style>
