<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心靈感應 (Mind Reader Magic) - Pro Ver.</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 自定義滾動條樣式 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
        
        /* 動畫類別 */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-zoom-in { animation: zoomIn 0.4s ease-out; }
        .animate-slide-in { animation: slideInRight 0.4s ease-out; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen overflow-hidden select-none">
    
    <!-- 主遊戲介面 -->
    <div id="app" class="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4 font-sans relative"></div>

    <!-- 後台 Modal 獨立層（固定在層級頂端，避免切換時整頁重繪閃爍） -->
    <div id="admin-overlay" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-2xl flex flex-col items-center justify-center p-4 custom-scrollbar overflow-y-auto hidden">
        <div id="admin-box" class="w-full max-w-md bg-slate-900 border border-purple-500/30 rounded-2xl p-6 shadow-2xl space-y-5 relative"></div>
    </div>

    <script>
        // --- 狀態管理 ---
        const state = {
            step: 0,
            mode: 'random', // 'random' | 'force'
            forcedSymbol: null,
            showAdminPanel: false,
            activeTab: 'force', // 'force' | 'mode'
            targetSymbol: null,
            grid: []
        };

        const symbols = ['★', '♥', '♠', '♦', '♣', '☀', '☾', '⚛', '☯', '☮', 'Ω', 'Σ', 'Ψ'];

        // --- SVG 圖示 HTML ---
        const getSparklesSVG = (className) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 9h4"/><path d="M3 5h4"/></svg>`;
        const getRefreshCwSVG = (className) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>`;
        const getZapSVG = (className) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
        const getEyeSVG = (className) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const getHelpCircleSVG = (className) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>`;
        const getArrowLeftSVG = (className) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`;

        // --- 邏輯函數 ---
        function initGame() {
            let winningSymbol;
            if (state.mode === 'force') {
                winningSymbol = state.forcedSymbol || '★';
            } else {
                winningSymbol = symbols[Math.floor(Math.random() * symbols.length)];
            }

            state.targetSymbol = winningSymbol;

            let newGrid = [];
            for (let i = 0; i < 100; i++) {
                if (i % 9 === 0) {
                    newGrid.push({ num: i, sym: winningSymbol });
                } else {
                    let randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                    while (randomSym === winningSymbol) {
                        randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                    }
                    newGrid.push({ num: i, sym: randomSym });
                }
            }
            state.grid = newGrid;
        }

        function toggleMagicMode() {
            if (state.mode === 'force') {
                state.mode = 'random';
                state.forcedSymbol = null;
            } else {
                state.mode = 'force';
                if (!state.forcedSymbol) state.forcedSymbol = '★';
            }
            renderGame();
            if (state.showAdminPanel) renderAdmin();
        }

        function setStep(newStep) {
            state.step = newStep;
            if (state.step === 2) {
                initGame();
            }
            renderGame();
        }

        // --- 渲染遊戲主介面 ---
        function renderGame() {
            const app = document.getElementById('app');

            const isForce = state.mode === 'force';
            const sparklesClass = `w-7 h-7 transition-all duration-300 ${isForce ? 'text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.8)] animate-pulse' : 'text-purple-400'}`;

            let html = `
                <!-- 背景發光特效 -->
                <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-purple-600/20 rounded-full blur-3xl animate-pulse"></div>
                    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse delay-700"></div>
                </div>

                <!-- 主容器 -->
                <div class="z-10 w-full max-w-md flex flex-col items-center gap-8">
                    
                    <!-- 對稱標題與對稱雙向閃爍圖示 -->
                    <header class="flex items-center justify-center gap-3 w-full mb-4 select-none">
                        <div onclick="toggleMagicMode()" class="cursor-pointer transition-transform active:scale-90 p-1.5 rounded-full hover:bg-white/5" title="點擊切換強選模式">
                            ${getSparklesSVG(sparklesClass)}
                        </div>
                        <h1 ondblclick="openAdminPanel()" class="text-3xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-purple-300 to-indigo-300 cursor-pointer active:opacity-80">心靈感應</h1>
                        <div onclick="toggleMagicMode()" class="cursor-pointer transition-transform active:scale-90 p-1.5 rounded-full hover:bg-white/5" title="點擊切換強選模式">
                            ${getSparklesSVG(sparklesClass)}
                        </div>
                    </header>

                    <!-- 遊戲內容區 -->
                    <div class="w-full bg-slate-800/50 backdrop-blur-md p-6 rounded-2xl border border-white/10 shadow-2xl min-h-[400px] flex flex-col items-center justify-center relative">
                        
                        ${state.step === 0 ? `
                            <div class="text-center space-y-6 animate-fade-in animate-zoom-in">
                                ${getEyeSVG('w-20 h-20 text-indigo-400 mx-auto opacity-80')}
                                <h2 class="text-2xl font-bold text-white">讀心術測試</h2>
                                <p class="text-slate-300 leading-relaxed">我能看透你的心思。<br/>請放鬆心情，跟隨我的引導。</p>
                                <div class="pt-4">
                                    <button onclick="setStep(1)" class="group relative flex items-center justify-center px-8 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full shadow-[0_0_20px_rgba(124,58,237,0.5)] hover:shadow-[0_0_30px_rgba(124,58,237,0.8)] hover:scale-105 transition-all duration-300 active:scale-95 text-white font-bold text-xl w-full max-w-xs mx-auto overflow-hidden">
                                        <span>開始感應</span>
                                    </button>
                                </div>
                            </div>
                        ` : ''}

                        ${state.step === 1 ? `
                            <div class="text-center space-y-6 animate-slide-in">
                                ${getHelpCircleSVG('w-16 h-16 text-indigo-400 mx-auto')}
                                <div class="text-left bg-black/20 p-4 rounded-xl space-y-3 text-lg text-slate-200">
                                    <p>1. 在心中想一個 <span class="text-yellow-400 font-bold">兩位數</span> (例如: 23)</p>
                                    <p>2. 將這兩個數字相加 (2 + 3 = 5)</p>
                                    <p>3. 用原本的數字減去相加的結果 (23 - 5 = 18)</p>
                                    <p>4. 記住這最後的數字！</p>
                                </div>
                                <div class="flex flex-col gap-3 w-full max-w-xs mx-auto">
                                    <button onclick="setStep(2)" class="group relative flex items-center justify-center px-8 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full shadow-[0_0_20px_rgba(124,58,237,0.5)] hover:shadow-[0_0_30px_rgba(124,58,237,0.8)] hover:scale-105 transition-all duration-300 active:scale-95 text-white font-bold text-xl w-full max-w-xs mx-auto overflow-hidden">
                                        <span>下一步</span>
                                    </button>
                                    <button onclick="setStep(0)" class="text-slate-500 hover:text-slate-300 text-sm flex items-center justify-center gap-1 transition-colors py-1">
                                        返回
                                    </button>
                                </div>
                            </div>
                        ` : ''}

                        ${state.step === 2 ? `
                            <div class="w-full flex flex-col h-full animate-fade-in">
                                <p class="text-center text-sm text-slate-400 mb-2">找到你的數字對應的符號，並用力記住它</p>
                                <div class="flex-1 overflow-y-auto grid grid-cols-5 gap-2 p-2 bg-black/20 rounded-xl mb-4 max-h-[300px] custom-scrollbar">
                                    ${state.grid.map(item => `
                                        <div class="flex flex-col items-center justify-center p-2 rounded bg-white/5 transition-colors">
                                            <span class="text-xs text-slate-500 font-mono">${item.num}</span>
                                            <span class="text-xl text-yellow-200">${item.sym}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="flex flex-col gap-3 w-full max-w-xs mx-auto">
                                    <button onclick="setStep(3)" class="group relative flex items-center justify-center px-8 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full shadow-[0_0_20px_rgba(124,58,237,0.5)] hover:shadow-[0_0_30px_rgba(124,58,237,0.8)] hover:scale-105 transition-all duration-300 active:scale-95 text-white font-bold text-xl w-full max-w-xs mx-auto overflow-hidden">
                                        <span>顯示答案</span>
                                    </button>
                                    <button onclick="setStep(1)" class="text-slate-500 hover:text-slate-300 text-sm flex items-center justify-center gap-1 transition-colors py-1">
                                        返回
                                    </button>
                                </div>
                            </div>
                        ` : ''}

                        ${state.step === 3 ? `
                            <div class="text-center space-y-8 animate-zoom-in">
                                <div class="relative">
                                    <div class="absolute inset-0 bg-purple-500 blur-[60px] opacity-20 animate-pulse"></div>
                                    <div class="relative z-10 text-8xl font-bold text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)] transform hover:scale-110 transition-transform cursor-default">
                                        ${state.targetSymbol}
                                    </div>
                                </div>
                                
                                <div class="space-y-2">
                                    <h3 class="text-2xl font-bold text-white">這就是你想的符號！</h3>
                                </div>

                                <div class="pt-4">
                                    <button onclick="setStep(0)" class="group relative flex items-center justify-center px-8 py-4 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-full shadow-[0_0_20px_rgba(124,58,237,0.5)] hover:shadow-[0_0_30px_rgba(124,58,237,0.8)] hover:scale-105 transition-all duration-300 active:scale-95 text-white font-bold text-xl w-full max-w-xs mx-auto overflow-hidden">
                                        <span>再玩一次</span>
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            app.innerHTML = html;
        }

        // --- 獨立局部渲染後台 Modal（不影響外層與透明遮罩，極致平滑零閃爍） ---
        function renderAdmin() {
            const overlay = document.getElementById('admin-overlay');
            const box = document.getElementById('admin-box');

            if (!state.showAdminPanel) {
                overlay.classList.add('hidden');
                overlay.classList.remove('animate-fade-in');
                return;
            }

            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
                overlay.classList.add('animate-fade-in');
            }

            box.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 class="text-lg font-bold text-white tracking-wide">魔術後台控制中心</h3>
                    <button onclick="closeAdminPanel()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors font-bold text-lg">✕</button>
                </div>

                <div class="flex bg-slate-800/80 p-1 rounded-xl gap-1">
                    <button onclick="switchTab('force')" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all ${state.activeTab === 'force' ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}">控管圖案</button>
                    <button onclick="switchTab('mode')" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all ${state.activeTab === 'mode' ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}">模式切換</button>
                </div>

                ${state.activeTab === 'force' ? `
                    <div class="space-y-4">
                        <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50">
                            <p class="text-xs text-slate-400 mb-1">當前預言鎖定的圖案（觀眾將記住）：</p>
                            <div class="text-2xl font-extrabold text-amber-400 flex items-center gap-3">
                                <span>${state.forcedSymbol ? state.forcedSymbol : (state.mode === 'force' ? '★ (強選模式)' : '無 (隨機模式)')}</span>
                                ${state.mode === 'force' ? `<span class="text-[10px] px-2 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full font-normal">強選中</span>` : ''}
                            </div>
                        </div>
                        <p class="text-xs font-semibold text-slate-300">點擊下方圖案，直接指定觀眾記住的結果：</p>
                        <div class="grid grid-cols-5 gap-2.5 max-h-[220px] overflow-y-auto p-2 bg-black/30 rounded-xl border border-slate-800 custom-scrollbar">
                            <button onclick="selectForcedSymbol(null)" class="h-11 rounded-lg border flex items-center justify-center font-bold text-xs transition-all ${state.forcedSymbol === null && state.mode === 'random' ? 'border-red-500 bg-red-500/20 text-red-300' : 'border-slate-700 text-slate-400 hover:bg-slate-800'}">無強選</button>
                            ${symbols.map(s => `
                                <button onclick="selectForcedSymbol('${s}')" class="h-11 rounded-lg border flex items-center justify-center text-xl transition-all ${state.forcedSymbol === s ? 'border-amber-400 bg-amber-400/20 text-amber-300 scale-105 shadow-[0_0_12px_rgba(251,191,36,0.4)]' : 'border-slate-700 text-slate-300 hover:bg-slate-800'}">${s}</button>
                            `).join('')}
                        </div>
                    </div>
                ` : `
                    <div class="space-y-2.5">
                        <div onclick="selectMode('random')" class="p-3 rounded-xl border cursor-pointer transition-all ${state.mode === 'random' ? 'border-purple-500 bg-purple-900/30 text-white' : 'border-slate-800 bg-slate-800/40 text-slate-400 hover:border-slate-700'}">
                            <div class="flex items-center justify-between font-bold text-sm mb-0.5">
                                <span>隨機真實感應模式</span>
                                ${state.mode === 'random' ? `<span class="text-[10px] text-purple-400 bg-purple-500/20 px-2 py-0.5 rounded">啟用中</span>` : ''}
                            </div>
                            <p class="text-[11px] text-slate-400">遵循數學規律，每次隨機產生預言圖案。</p>
                        </div>
                        <div onclick="selectMode('force')" class="p-3 rounded-xl border cursor-pointer transition-all ${state.mode === 'force' ? 'border-amber-500 bg-amber-900/30 text-white' : 'border-slate-800 bg-slate-800/40 text-slate-400 hover:border-slate-700'}">
                            <div class="flex items-center justify-between font-bold text-sm mb-0.5">
                                <span>強選模式 (圖示亮起)</span>
                                ${state.mode === 'force' ? `<span class="text-[10px] text-amber-400 bg-amber-500/20 px-2 py-0.5 rounded">啟用中</span>` : ''}
                            </div>
                            <p class="text-[11px] text-slate-400">點擊標題兩側圖示亮黃光即進入強選模式。</p>
                        </div>
                    </div>
                `}

                <div class="pt-2">
                    <button onclick="closeAdminPanel()" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg transition-all text-sm">儲存設定並返回遊戲</button>
                </div>
            `;
        }

        // --- 事件綁定 ---
        function openAdminPanel() {
            state.showAdminPanel = true;
            renderAdmin();
        }

        function closeAdminPanel() {
            state.showAdminPanel = false;
            renderAdmin();
        }

        function switchTab(tab) {
            state.activeTab = tab;
            renderAdmin();
        }

        function selectForcedSymbol(sym) {
            if (sym === null) {
                state.forcedSymbol = null;
                state.mode = 'random';
            } else {
                state.forcedSymbol = sym;
                state.mode = 'force';
            }
            renderAdmin();
            renderGame();
        }

        function selectMode(mode) {
            state.mode = mode;
            if (mode === 'force' && !state.forcedSymbol) {
                state.forcedSymbol = '★';
            }
            if (mode === 'random') {
                state.forcedSymbol = null;
            }
            renderAdmin();
            renderGame();
        }

        // 鍵盤監聽 (Shift+A, Shift+M, F2 喚醒後台)
        window.addEventListener('keydown', (e) => {
            if ((e.shiftKey && (e.key === 'A' || e.key === 'a' || e.key === 'M' || e.key === 'm')) || e.key === 'F2') {
                state.showAdminPanel = !state.showAdminPanel;
                renderAdmin();
            }
        });

        // 初始渲染
        renderGame();
        renderAdmin();
    </script>
</body>
</html>
