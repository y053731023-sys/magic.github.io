<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TOP SECRET - 終極單機版</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 防干擾與觸控鎖定 */
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y; 
      background-color: #171717; /* neutral-900 */
    }
    /* 解除輸入框的封印 */
    input {
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    .zoom-in { animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    
    /* 隱藏捲軸 */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-neutral-100 font-sans selection:bg-amber-500/30 overflow-x-hidden pb-10">

  <!-- ==================== 頂部導航 & 隱藏機關 ==================== -->
  <header class="bg-neutral-950 border-b border-neutral-800 p-4 sticky top-0 z-50">
    <div class="w-full max-w-md md:max-w-2xl lg:max-w-4xl mx-auto flex items-center justify-center">
      
      <!-- 🌟 總安全開關 (Master Safe Switch) 🌟 -->
      <div id="btn-master-safe" class="p-2 cursor-pointer select-none group" style="-webkit-tap-highlight-color: transparent;">
        <!-- 固定記號 (長按開啟後台) -->
        <svg class="w-6 h-6 text-neutral-800 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path></svg>
      </div>

    </div>
  </header>

  <main class="w-full max-w-md md:max-w-2xl lg:max-w-4xl mx-auto p-4 sm:p-6 md:p-8 lg:p-12 flex flex-col justify-center min-h-[85vh]">
    
    <!-- ==================== 魔方陣 (耆那之眼) 視圖 ==================== -->
    <div id="container-square" class="animate-in fade-in duration-500 w-full mt-4">
      <div id="grid-square-wrapper" class="relative bg-neutral-100 p-2 sm:p-3 rounded-xl shadow-2xl cursor-default border-4 border-neutral-700">
        <div id="grid-square" class="grid grid-cols-4 relative w-full aspect-square bg-white">
          <!-- 全域虛線網格 (密碼載體) -->
          <svg id="master-grid-lines" class="absolute inset-0 w-full h-full pointer-events-none z-20"></svg>
          <!-- 全域手寫板 -->
          <svg id="master-drawing-board" class="absolute inset-0 w-full h-full z-30 touch-none pointer-events-none"></svg>
          <!-- JS 注入格子 -->
        </div>
        <!-- 展演驗證動畫 -->
        <div id="square-verify" class="hidden absolute inset-0 pointer-events-none flex items-center justify-center animate-in zoom-in duration-700 bg-neutral-900/50 backdrop-blur-[2px] z-50">
          <div class="bg-amber-500 text-neutral-900 px-6 py-3 rounded-xl font-bold text-xl flex items-center shadow-xl">
            <svg class="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            幻和皆為 <span id="square-verify-text" class="ml-2"></span>
          </div>
        </div>
      </div>
      
      <!-- 前台操作列 (橡皮擦與清空) -->
      <div id="front-toolbar" class="flex justify-end mt-4 space-x-3 transition-opacity duration-300">
        <button id="btn-front-erase" class="flex items-center justify-center p-3 rounded-full bg-neutral-800 text-neutral-400 shadow-xl transition-all" title="自行擦除">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
        </button>
        <button id="btn-front-clear" class="flex items-center justify-center p-3 rounded-full bg-neutral-800 text-rose-500 hover:text-rose-400 shadow-xl transition-all" title="全部清除">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
      
    </div>

  </main>

  <!-- ==================== 隱藏的後台設定 (Settings Modal) ==================== -->
  <div id="settings-modal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="bg-neutral-900 border border-neutral-700/50 rounded-2xl p-6 w-full max-w-sm space-y-6 shadow-2xl relative">
      <button id="btn-close-settings" class="absolute top-4 right-4 text-neutral-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      
      <h2 class="text-xl font-bold text-neutral-200 text-center mb-2">後台設定</h2>
      
      <div>
        <label class="block text-sm font-medium text-neutral-400 mb-2">觀眾指定的組合 (6位數)</label>
        <input id="input-master-number" type="number" class="w-full bg-neutral-800 border border-neutral-600 rounded-xl px-4 py-3 text-2xl font-bold text-center text-emerald-400 focus:outline-none focus:border-emerald-500 transition-colors tracking-widest" placeholder="">
      </div>


      
      <div class="flex justify-center pt-4">
        <button id="btn-clear" class="flex items-center space-x-2 px-4 py-3 text-rose-400 hover:text-rose-300 hover:bg-rose-950/30 transition-colors bg-neutral-800/80 rounded-xl w-full justify-center">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
          <span class="font-bold">清空畫布</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    // --- 全域狀態 ---
    let appMode = 'practice'; // 'practice' only
    let previousMode = 'practice';
    let isPeekerEnabled = true; // 記號常駐開啟
    let masterNumber = '';
    
    let squareAnswers = Array(16).fill('');
    let squareStep = 0;

    const greyCellsIndices = [3, 4, 10, 13];
    let fillSeq1D = [0, 1, 2, 3, 4, 8, 12, 5, 6, 7, 9, 13, 10, 11, 14, 15];

    function shuffleRevealSeq() {
      fillSeq1D = Array.from({length: 16}, (_, i) => i);
      for (let i = fillSeq1D.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [fillSeq1D[i], fillSeq1D[j]] = [fillSeq1D[j], fillSeq1D[i]];
      }
    }

    // --- DOM 節點 ---
    const btnMasterSafe = document.getElementById('btn-master-safe');

    const btnClear = document.getElementById('btn-clear');
    const inpMasterNum = document.getElementById('input-master-number');

    const frontToolbar = document.getElementById('front-toolbar');
    const btnFrontClear = document.getElementById('btn-front-clear');

    const gridSquare = document.getElementById('grid-square');
    const gridSquareWrapper = document.getElementById('grid-square-wrapper');
    
    const squareVerify = document.getElementById('square-verify');
    const squareVerifyText = document.getElementById('square-verify-text');

    // --- 虛線邊界與密碼網格 ---
    // 效能優化版：先拼接字串最後再一次性寫入 DOM
    const updateDottedGrid = () => {
        const squareSvg = document.getElementById('master-grid-lines');
        if (!squareSvg) return;
        
        const numDots = 10;
        let squareHTML = '';
        
        const drawSegment = (isHoriz, startIndex, endIndex, fixedIndex, targetDigit) => {
            const step = (endIndex - startIndex) / numDots;
            const highlightIdx = targetDigit === 0 ? 10 : targetDigit; 
            
            for (let i = 1; i <= numDots; i++) {
                const isHighlight = (isPeekerEnabled && targetDigit !== -1 && i === highlightIdx);
                const pos = startIndex + (i - 0.5) * step;
                
                // 極限低對比度，顏色完全一致，僅依賴些微的粗細與透明度差異
                const size = isHighlight ? 2.8 : 2.5;
                const opacity = isHighlight ? 0.6 : 0.45;
                const color = '#404040';
                
                let cx = isHoriz ? pos : fixedIndex;
                let cy = isHoriz ? fixedIndex : pos;
                squareHTML += `<rect x="${cx}%" y="${cy}%" width="${size}" height="${size}" transform="translate(-${size/2}, -${size/2})" fill="${color}" opacity="${opacity}"/>`;
            }
        };

        for (let row = 0; row < 4; row++) {
            for (let col = 0; col < 4; col++) {
                const index = row * 4 + col;
                const ans = squareAnswers[index];
                
                let tens = -1, ones = -1;
                if (ans !== undefined && ans !== '') {
                    const val = parseInt(String(ans), 10);
                    tens = Math.floor(val / 10);
                    ones = val % 10;
                }
                
                drawSegment(true, col*25, (col+1)*25, row*25, tens);
                drawSegment(false, row*25, (row+1)*25, (col+1)*25, ones);
            }
        }
        
        // 外圍
        for (let col = 0; col < 4; col++) {
            drawSegment(true, col*25, (col+1)*25, 100, -1);
        }
        for (let row = 0; row < 4; row++) {
            drawSegment(false, row*25, (row+1)*25, 0, -1);
        }
        
        // 一次性渲染
        squareSvg.innerHTML = squareHTML;
    };

    // --- 計算邏輯 ---
    // 內建的多套 4x4 魔方陣 (幻和 34，且 13,14,15,16 皆分布在不同的行列與對角線上)
    const baseTemplates = [
      [
        4, 5, 11, 14,
        15, 10, 8, 1,
        6, 3, 13, 12,
        9, 16, 2, 7
      ],
      [
        8, 11, 14, 1,
        13, 2, 7, 12,
        3, 16, 9, 6,
        10, 5, 4, 15
      ]
    ];

    // 取得 8 種對稱變換的其中一種
    function getSymmetry(arr, symType) {
      const getIdx = (r, c) => {
        switch(symType) {
          case 0: return r*4 + c;                 // 原版
          case 1: return (3-c)*4 + r;             // 旋轉 90度
          case 2: return (3-r)*4 + (3-c);         // 旋轉 180度
          case 3: return c*4 + (3-r);             // 旋轉 270度
          case 4: return (3-r)*4 + c;             // 水平翻轉
          case 5: return r*4 + (3-c);             // 垂直翻轉
          case 6: return c*4 + r;                 // 主對角線翻轉
          case 7: return (3-c)*4 + (3-r);         // 副對角線翻轉
          default: return r*4 + c;
        }
      };
      let res = new Array(16);
      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          res[r*4 + c] = arr[getIdx(r, c)];
        }
      }
      return res;
    }

    let currentBaseArray = baseTemplates[0];

    function calculateAnswers() {
      const val = parseInt(masterNumber, 10);
      if (isNaN(val)) {
        squareAnswers = Array(16).fill('');
        return;
      }

      const xStr = masterNumber.length >= 2 ? masterNumber.slice(-2) : masterNumber;
      const x = parseInt(xStr, 10) || 0;
      const S = x < 34 ? 34 : x; 
      const D = S - 34;          
      const Q = Math.floor(D / 4); 
      const R = D % 4;           

      const tens = Math.floor(x / 10);
      const ones = x % 10;
      
      let bestBaseArray = null;
      let foundMatching = false;
      
      // 窮舉所有對稱與旋轉，找出讓 "十位數" 和 "個位數" 皆存在，且視覺上十位數位於個位數左/上的排列
      const bases = [0, 1];
      const syms = [0, 1, 2, 3, 4, 5, 6, 7];
      bases.sort(() => Math.random() - 0.5);
      syms.sort(() => Math.random() - 0.5);
      
      for(let b of bases) {
        for(let s of syms) {
          const arr = getSymmetry(baseTemplates[b], s);
          const trialAnswers = arr.map(n => (n >= 13) ? n + Q + R : n + Q);
          
          let tIdx = trialAnswers.indexOf(tens);
          let oIdx = (tens === ones) ? trialAnswers.lastIndexOf(ones) : trialAnswers.indexOf(ones);
          
          if (tIdx !== -1 && oIdx !== -1 && tIdx !== oIdx && tIdx < oIdx) {
            bestBaseArray = arr;
            squareAnswers = trialAnswers;
            foundMatching = true;
            break;
          }
        }
        if (foundMatching) break;
      }
      
      if (!foundMatching) {
        // 如果這個數字(超過範圍)無法同時包含十位與個位，就隨機處理
        currentBaseArray = getSymmetry(baseTemplates[Math.floor(Math.random() * baseTemplates.length)], Math.floor(Math.random() * 8));
        squareAnswers = currentBaseArray.map(n => (n >= 13) ? n + Q + R : n + Q);
      } else {
        currentBaseArray = bestBaseArray;
      }
    }

    // --- UI 互動邏輯 ---
    
    // 總安全開關 (長按開啟後台，短按切換機關)
    let eyePressTimer = null;
    let eyeLongPressed = false;
    
    btnMasterSafe.addEventListener('pointerdown', (e) => {
      eyeLongPressed = false;
      eyePressTimer = setTimeout(() => {
        eyeLongPressed = true;
        document.getElementById('settings-modal').classList.remove('hidden');
      }, 600); // 600ms 長按觸發
    });
    
    btnMasterSafe.addEventListener('pointerup', () => clearTimeout(eyePressTimer));
    btnMasterSafe.addEventListener('pointerleave', () => clearTimeout(eyePressTimer));

    
    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').classList.add('hidden');
    });

    // 模式切換 (已簡化，僅保留 Practice 狀態設定)
    function updateModeUI() {
      if (frontToolbar) {
        frontToolbar.classList.add('opacity-0', 'pointer-events-none');
      }

      const masterDrawingBoard = document.getElementById('master-drawing-board');
      masterDrawingBoard.style.pointerEvents = 'none';

      // 更新畫布格子狀態
      renderCellsMode();
    }

    // 輸入改變
    inpMasterNum.addEventListener('input', (e) => {
      masterNumber = e.target.value;
      localStorage.setItem('square_master_number', masterNumber);
      calculateAnswers();
      updatePracticeState(); // 更新展演模式的數字
      updateDottedGrid();
    });

    let autoRevealInterval = null;

    // --- 全域畫板邏輯 ---
    const masterDrawingBoard = document.getElementById('master-drawing-board');
    let isGlobalDrawing = false;
    let globalPolyline = null;

    function eraseAtPoint(e) {
      if (e.target && e.target.tagName === 'polyline') {
        e.target.remove();
      } else {
        const elements = document.elementsFromPoint(e.clientX, e.clientY);
        elements.forEach(el => {
          if(el.tagName === 'polyline') el.remove();
        });
      }

      masterDrawingBoard.style.pointerEvents = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      masterDrawingBoard.style.pointerEvents = 'auto'; // restore

      const cell = under?.closest('.cell-wrapper');
      if (cell) {
        const inp = cell.querySelector('.cell-input');
        const txt = cell.querySelector('.cell-text');
        if(inp) inp.value = '';
        if(txt) txt.textContent = '';
      }
    }

    masterDrawingBoard.addEventListener('pointerdown', (e) => {
      masterDrawingBoard.setPointerCapture(e.pointerId);
      isGlobalDrawing = true;

      if (appMode === 'draw') {
        globalPolyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        globalPolyline.setAttribute('fill', 'none');
        globalPolyline.setAttribute('stroke', '#1e293b');
        globalPolyline.setAttribute('stroke-width', '5');
        globalPolyline.setAttribute('stroke-linecap', 'round');
        globalPolyline.setAttribute('stroke-linejoin', 'round');
        masterDrawingBoard.appendChild(globalPolyline);

        const rect = masterDrawingBoard.getBoundingClientRect();
        const pt1 = masterDrawingBoard.createSVGPoint(); pt1.x = e.clientX - rect.left; pt1.y = e.clientY - rect.top;
        const pt2 = masterDrawingBoard.createSVGPoint(); pt2.x = e.clientX - rect.left + 0.1; pt2.y = e.clientY - rect.top;
        globalPolyline.points.appendItem(pt1);
        globalPolyline.points.appendItem(pt2);
      } else if (appMode === 'erase') {
        eraseAtPoint(e);
      }
    });

    masterDrawingBoard.addEventListener('pointermove', (e) => {
      if (!isGlobalDrawing) return;

      if (appMode === 'draw') {
        const rect = masterDrawingBoard.getBoundingClientRect();
        const pt = masterDrawingBoard.createSVGPoint();
        pt.x = e.clientX - rect.left;
        pt.y = e.clientY - rect.top;
        globalPolyline.points.appendItem(pt);
      } else if (appMode === 'erase') {
        eraseAtPoint(e);
      }
    });

    masterDrawingBoard.addEventListener('pointerup', (e) => {
      if (isGlobalDrawing) {
        isGlobalDrawing = false;
        masterDrawingBoard.releasePointerCapture(e.pointerId);
      }
    });

    const handleClearBoard = () => {
      document.querySelectorAll('.cell-input').forEach(el => el.value = '');
      document.querySelectorAll('.cell-text').forEach(el => el.textContent = '');
      document.getElementById('master-drawing-board').innerHTML = '';
      
      document.querySelectorAll('.cell-wrapper').forEach(wrapper => {
        wrapper.dataset.manualReveal = 'false';
      });

      squareStep = 0;
      if (autoRevealInterval) {
        clearInterval(autoRevealInterval);
        autoRevealInterval = null;
      }
      calculateAnswers(); // 重置數學矩陣
      updatePracticeState();
    };

    btnClear.addEventListener('click', handleClearBoard);
    if (btnFrontClear) btnFrontClear.addEventListener('click', handleClearBoard);

    // --- 展演模式點擊推進 ---
    gridSquareWrapper.addEventListener('click', (e) => {
      // 若點擊輸入框，不觸發自動推進
      if (e.target.closest('.cell-input')) return;
      
      if (appMode === 'practice' && squareStep === 0 && !autoRevealInterval) {
        fillSeq1D = Array.from({length: 16}, (_, i) => i); 
        for (let i = fillSeq1D.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fillSeq1D[i], fillSeq1D[j]] = [fillSeq1D[j], fillSeq1D[i]];
        }
        
        const val = parseInt(masterNumber, 10);
        if (!isNaN(val)) {
            const xStr = masterNumber.length >= 2 ? masterNumber.slice(-2) : masterNumber;
            const x = parseInt(xStr, 10) || 0;
            const tens = Math.floor(x / 10);
            const units = x % 10;
            
            // 找出矩陣中包含目標十位與個位數的正確位置
            const tensIdx = squareAnswers.indexOf(tens);
            const unitsIdx = (tens === units) ? squareAnswers.lastIndexOf(units) : squareAnswers.indexOf(units);
            
            if (tensIdx !== -1 && unitsIdx !== -1 && tensIdx !== unitsIdx) {
                // 將真正的十位與個位數隱藏至最後 (14與15階段)
                fillSeq1D = fillSeq1D.filter(idx => idx !== tensIdx && idx !== unitsIdx);
                // 系統生成時已確保 tensIdx < unitsIdx，所以直接依序放入即可
                fillSeq1D.push(tensIdx, unitsIdx);
            } else {
                // 若找不到對應數字，至少確保最後兩格在上到下、左到右的順序
                const last2 = [fillSeq1D[14], fillSeq1D[15]].sort((a,b) => a-b);
                fillSeq1D[14] = last2[0];
                fillSeq1D[15] = last2[1];
            }
        }

        autoRevealInterval = setInterval(() => {
          if (squareStep < 14) {
            squareStep++;
            updatePracticeState();
          } else {
            clearInterval(autoRevealInterval);
            autoRevealInterval = null;
            updatePracticeState(); 
          }
        }, 600); // 自動彈出間隔時間 0.6s
      }
    });

    // --- 畫布與格子生成器 ---
    function buildCell(type, index) {
      const wrapper = document.createElement('div');
      
      wrapper.className = `cell-wrapper relative flex items-center justify-center bg-white select-none overflow-hidden aspect-square rounded-sm`;
      wrapper.dataset.type = type;
      wrapper.dataset.index = index;
      
      // 防止長按反白或跳出選單
      wrapper.style.touchAction = 'none';
      wrapper.style.WebkitTouchCallout = 'none';
      wrapper.style.WebkitUserSelect = 'none';

      // 支援最後兩格：觀眾輸入 或 魔術師雙擊展演
      let tapTimer = 0;
      wrapper.addEventListener('pointerdown', (e) => {
        if (appMode === 'practice' && squareStep >= 14) {
            const idx = parseInt(wrapper.dataset.index, 10);
            if (fillSeq1D.indexOf(idx) >= 14) {
                const now = Date.now();
                if (now - tapTimer < 300) {
                    // 雙擊：魔術師一鍵顯露數字
                    e.preventDefault();
                    wrapper.dataset.manualReveal = 'true';
                    updatePracticeState();
                } else {
                    // 單擊：無作用，保留給輸入框 focus 讓觀眾點擊輸入
                    tapTimer = now;
                }
            }
        }
      });

      // 移除原有的灰格與 seqText
      const bgClass = 'bg-white text-slate-800';
      const textClass = 'text-4xl sm:text-5xl md:text-6xl lg:text-7xl';

      wrapper.innerHTML = `
        <!-- 展演模式顯示 -->
        <div class="cell-practice absolute inset-0 flex items-center justify-center transition-all duration-500 opacity-0 scale-50 ${bgClass}">
          <span class="${textClass} font-bold tracking-widest calc-val"></span>
        </div>

        <!-- 自由輸入與手寫 -->
        <input type="text" class="cell-input absolute inset-0 w-full h-full bg-transparent text-center ${textClass} font-bold text-slate-800 outline-none z-10 placeholder-transparent focus:bg-slate-50/50 transition-colors tracking-widest hidden" style="-webkit-user-select: text; user-select: text;" />
        <div class="cell-text absolute inset-0 flex items-center justify-center ${textClass} font-bold text-slate-800 pointer-events-none tracking-widest hidden"></div>
        
      `;

      const input = wrapper.querySelector('.cell-input');
      const textDiv = wrapper.querySelector('.cell-text');

      // 同步輸入框內容到下層 div
      input.addEventListener('input', (e) => { textDiv.textContent = e.target.value; });

      wrapper.addEventListener('contextmenu', (e) => {
        if (isPeekerEnabled) e.preventDefault(); // 有開機關時阻擋選單
      });

      return wrapper;
    }

    // --- 渲染邏輯 ---
    function renderCellsMode() {
      const wrappers = document.querySelectorAll('.cell-wrapper');
      
      wrappers.forEach(wrapper => {
        const input = wrapper.querySelector('.cell-input');
        const textDiv = wrapper.querySelector('.cell-text');
        const practiceLayer = wrapper.querySelector('.cell-practice');

        input.classList.add('hidden');
        textDiv.classList.add('hidden');
        practiceLayer.classList.remove('hidden');
      });
      
      updatePracticeState();
    }

    function updatePracticeState() {
      // 1. 更新數字
      document.querySelectorAll('.cell-wrapper').forEach(wrapper => {
        const index = parseInt(wrapper.dataset.index, 10);
        const valSpan = wrapper.querySelector('.calc-val');
        
        valSpan.textContent = squareAnswers[index] || '';
      });

      // 2. 更新展演動畫 (顯現/隱藏)
      if (appMode !== 'practice') {
        squareVerify.classList.add('hidden');
        return;
      }

      // 處理魔方陣進度
      document.querySelectorAll('.cell-wrapper[data-type="square"]').forEach((wrapper, idx) => {
        const practiceLayer = wrapper.querySelector('.cell-practice');
        const inputLayer = wrapper.querySelector('.cell-input');
        
        const seqIndex = fillSeq1D.indexOf(idx);
        let isRevealed = seqIndex < squareStep;
        
        if (squareStep >= 14 && wrapper.dataset.manualReveal === 'true') {
            isRevealed = true;
        }
        
        if (isRevealed) {
          practiceLayer.classList.remove('opacity-0', 'scale-50');
          practiceLayer.classList.add('opacity-100', 'scale-100');
          inputLayer.classList.add('hidden');
        } else {
          practiceLayer.classList.add('opacity-0', 'scale-50');
          practiceLayer.classList.remove('opacity-100', 'scale-100');
          
          if (squareStep >= 14) {
            // 最後兩個空格，解除隱藏，讓觀眾輸入但保持純白無浮水印
            inputLayer.classList.remove('hidden');
          } else {
            inputLayer.classList.add('hidden');
          }
        }
      });

      // // 原本會在完全解開後顯示總和，依需求隱藏
      // if (squareStep >= 16 && masterNumber) {
      //   const xStr = masterNumber.length >= 2 ? masterNumber.slice(-2) : masterNumber;
      //   squareVerifyText.textContent = xStr;
      //   squareVerify.classList.remove('hidden');
      // } else {
      //   squareVerify.classList.add('hidden');
      // }
      
      // 永遠隱藏總和提示
      squareVerify.classList.add('hidden');
    }

    // --- 初始化執行 ---
    const savedNum = localStorage.getItem('square_master_number');
    if (savedNum) {
      masterNumber = savedNum;
      inpMasterNum.value = savedNum;
    }

    for(let i=0; i<16; i++) gridSquare.appendChild(buildCell('square', i));
    
    calculateAnswers();
    updateModeUI();
    updateDottedGrid();

  </script>
</body>
</html>
