    <script>
        // 定義魔術後台編號對應顏色 (1~7, 包含粉紅色=6)
        const colors = [
            { id: '1', name: '紅', hex: '#EF4444' },
            { id: '2', name: '橙', hex: '#F97316' },
            { id: '3', name: '黃', hex: '#EAB308' },
            { id: '4', name: '綠', hex: '#22C55E' },
            { id: '5', name: '藍', hex: '#3B82F6' },
            { id: '6', name: '粉', hex: '#EC4899' },
            { id: '7', name: '紫', hex: '#A855F7' },
            { id: '0', name: '白', hex: '#ffffff' } 
        ];

        let currentColor = colors[0]; 
        let isLocked = false; 

        // 紀錄服飾顏色編號 (襯衫、領帶、長褲、襪子、皮鞋)
        const partColors = {
            shirt: '0',
            tie: '0',
            trousers: '0',
            socks: '0',
            shoes: '0'
        };

        // 建立調色盤
        const paletteContainer = document.getElementById('palette');
        colors.filter(c => c.id !== '0').forEach((color, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full transition-transform duration-200 outline-none focus:outline-none`;
            btn.style.backgroundColor = color.hex;
            btn.setAttribute('aria-label', color.name);
            
            if (index === 0) btn.classList.add('active');

            btn.onclick = () => {
                if (isLocked) return; 
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = color;
            };
            paletteContainer.appendChild(btn);
        });

        // 綁定著色事件：同部位的區塊一起變色
        const colorAreas = document.querySelectorAll('.color-area');
        colorAreas.forEach(area => {
            area.addEventListener('click', function() {
                if (isLocked) return; 

                const partName = this.getAttribute('data-part');
                const fillHex = currentColor.hex;
                const colorId = currentColor.id;

                const relatedParts = document.querySelectorAll(`.part-${partName}`);
                relatedParts.forEach(p => p.setAttribute('fill', fillHex));

                partColors[partName] = colorId;
            });
        });

        function showToast(message, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, duration);
        }

        // 魔術核心：鎖定並偷偷複製色碼
        function lockAndCopyCode() {
            // 組合 5 碼數字
            const colorCode = `${partColors.shirt}${partColors.tie}${partColors.trousers}${partColors.socks}${partColors.shoes}`;
            
            // 靜默複製 (使用 execCommand 確保兼容性)
            const tempInput = document.createElement("input");
            tempInput.value = colorCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            // 鎖定介面
            isLocked = true;
            document.getElementById('app-container').classList.remove('app-active');
            document.getElementById('palette-container').classList.add('locked-palette');
            document.getElementById('instruction-text').innerText = '顏色已鎖定。';
            
            showToast('上色已完成！');

            document.getElementById('lock-btn').classList.add('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
        }

        function resetApp() {
            isLocked = false;
            document.getElementById('app-container').classList.add('app-active');
            document.getElementById('palette-container').classList.remove('locked-palette');
            document.getElementById('instruction-text').innerText = '點擊下方顏色，再點擊服裝部位進行上色';
            
            colorAreas.forEach(area => area.setAttribute('fill', '#ffffff'));
            for (let key in partColors) {
                partColors[key] = '0';
            }

            document.getElementById('lock-btn').classList.remove('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
        }
    </script>
</body>
</html>
