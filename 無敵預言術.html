<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心靈感應術 - 撲克牌讀心</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fade-in {
            animation: fade-in 0.8s ease-out forwards;
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
        }
        .fill-mode-backwards {
            animation-fill-mode: backwards;
        }
        .animate-spin-slow {
            animation: spin-slow 4s linear infinite;
        }
        
        /* 新增：卡片被滑走(丟棄)的動畫特效 */
        @keyframes swipe-out {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) rotate(15deg) scale(0.8); opacity: 0; }
        }
        .animate-swipe-out {
            animation: swipe-out 0.4s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards !important;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-white selection:bg-purple-500 overflow-x-hidden relative">

    <!-- 背景裝飾 (增加神秘感) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-purple-900/20 rounded-full blur-[100px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-indigo-900/10 rounded-full blur-[100px] animate-pulse" style="animation-delay: 1s;"></div>
        <div class="absolute top-[40%] left-[40%] w-[20%] h-[20%] bg-amber-600/5 rounded-full blur-[80px]"></div>
    </div>

    <!-- 主要內容容器 -->
    <main id="app" class="relative z-10 container mx-auto px-4 py-8 min-h-screen flex flex-col items-center justify-center">
        <!-- 內容將由 JavaScript 動態渲染 -->
    </main>

    <script>
        // --- 資料設定 ---
        const SUIT_ICONS = {
            hearts: '♥',
            diamonds: '♦',
            spades: '♠',
            clubs: '♣',
        };

        // 全域變數儲存當前局的卡牌
        let currentInitialCards = [];
        let currentRevealCards = [];

        // 隨機產生並洗牌的函數 (確保 JQK 平均且顏色平均)
        function generateNewGameCards() {
            const shuffle = (arr) => {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            };

            let selectionPile = [];
            let revealPool = [];
            let idCounter = 1;

            ['J', 'Q', 'K'].forEach(rank => {
                const reds = [
                    { id: idCounter++, rank: rank, suit: 'hearts', color: 'red' },
                    { id: idCounter++, rank: rank, suit: 'diamonds', color: 'red' }
                ];
                const blacks = [
                    { id: idCounter++, rank: rank, suit: 'spades', color: 'black' },
                    { id: idCounter++, rank: rank, suit: 'clubs', color: 'black' }
                ];

                shuffle(reds);
                shuffle(blacks);

                // 各取一紅一黑進入選牌區 (保證 3紅3黑)
                selectionPile.push(reds[0]);
                selectionPile.push(blacks[0]);

                // 剩下的進入揭曉區
                revealPool.push(reds[1]);
                revealPool.push(blacks[1]);
            });

            currentInitialCards = shuffle(selectionPile);
            currentRevealCards = shuffle(revealPool).slice(0, 5); // 揭曉區只秀 5 張
        }

        // --- 渲染輔助函數 ---

        // 處理卡片點擊滑掉的邏輯
        function handleCardSwipe(element) {
            // 防止重複點擊
            if (element.classList.contains('pointer-events-none')) return;
            
            // 加上滑出動畫
            element.classList.add('animate-swipe-out');
            
            // 禁用整個卡牌容器的點擊，避免同時點多張
            document.getElementById('card-grid').classList.add('pointer-events-none');

            // 等待動畫結束後，跳轉到結果頁面
            setTimeout(() => {
                showReveal();
            }, 400); // 動畫長度大約 0.4 秒
        }

        // 產生單張卡牌的 HTML 字串 (極簡乾淨風)
        function getCardHTML(card, delayMs = 0, isSelectable = false) {
            const textColor = card.color === 'red' ? 'text-red-600' : 'text-slate-900';
            const icon = SUIT_ICONS[card.suit];
            
            // 根據是否在選牌階段，決定卡片是否可以點擊
            const clickAttr = isSelectable ? 'onclick="handleCardSwipe(this)"' : '';
            const cursorClass = isSelectable ? 'cursor-pointer hover:-translate-y-2' : '';
            
            return `
                <div style="animation-delay: ${delayMs}ms" class="animate-fade-in-up fill-mode-backwards">
                    <div ${clickAttr} class="relative w-24 h-36 md:w-32 md:h-48 bg-white rounded-xl shadow-lg flex flex-col justify-between p-2.5 md:p-3.5 select-none transform ${cursorClass} transition-all duration-300 border border-slate-200">
                        <div class="text-base md:text-xl font-bold ${textColor} flex items-center gap-1 leading-none">
                            <span>${card.rank}</span>
                            <span>${icon}</span>
                        </div>
                        
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl md:text-6xl ${textColor} opacity-90">
                            ${icon}
                        </div>

                        <div class="text-base md:text-xl font-bold ${textColor} flex items-center gap-1 leading-none rotate-180 self-end">
                            <span>${card.rank}</span>
                            <span>${icon}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        const appContainer = document.getElementById('app');

        // 1. 顯示選牌畫面
        function showSelection() {
            generateNewGameCards();
            // 傳入 true 讓卡片可以被點擊
            const cardsHTML = currentInitialCards.map((card, idx) => getCardHTML(card, idx * 80, true)).join('');

            appContainer.innerHTML = `
                <div class="text-center w-full max-w-5xl animate-fade-in">
                    <div class="mb-4 flex justify-center">
                        <i data-lucide="eye" class="w-10 h-10 text-amber-400"></i>
                    </div>
                    <h2 class="text-3xl md:text-4xl font-bold mb-8 text-amber-100 drop-shadow-md">
                        在心裡選一張牌
                    </h2>
                    
                    <div id="card-grid" class="grid grid-cols-3 md:grid-cols-6 gap-3 md:gap-4 mb-12 justify-items-center">
                        ${cardsHTML}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 2. 顯示結果 (極簡版，只有卡片跟按鈕)
        function showReveal() {
            // 傳入 false 讓卡片變成純展示不可點擊
            const cardsHTML = currentRevealCards.map((card, idx) => getCardHTML(card, idx * 80, false)).join('');

            appContainer.innerHTML = `
                <div class="text-center w-full max-w-5xl animate-fade-in flex flex-col items-center justify-center min-h-[60vh]">
                    
                    <!-- 只保留揭曉的 5 張卡牌 -->
                    <div class="grid grid-cols-3 md:grid-cols-5 gap-3 md:gap-4 mb-16 justify-items-center justify-center max-w-4xl mx-auto">
                        ${cardsHTML}
                    </div>

                    <!-- 重新開始按鈕 -->
                    <div class="flex flex-col md:flex-row gap-4 justify-center">
                        <button onclick="showSelection()" class="px-8 py-3 bg-slate-800 border border-slate-600 rounded-full text-lg font-bold shadow-lg hover:bg-slate-700 hover:border-amber-400/50 hover:-translate-y-1 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="refresh-cw" class="w-5 h-5 text-emerald-400"></i>
                            再玩一次
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 啟動應用 (直接進入選牌)
        showSelection();

    </script>
</body>
</html>
